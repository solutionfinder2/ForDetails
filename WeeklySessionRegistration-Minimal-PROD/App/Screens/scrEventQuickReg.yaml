                                     EventID: varEvqSelSlot.EventID,
                                     EventName: varEvqSelSlot.EventName,
                                     PhoneNumber: Substitute(Substitute(Substitute(Substitute(Substitute(txtRegPhone_EvQ.Text, "-", ""), " ", ""), "(", ""), ")", ""), ".", ""),
                                     DepartmentName: If(IsBlank(cmbRegDept_EvQ.Selected.Value), Blank(), {Value: cmbRegDept_EvQ.Selected.Value}),
                                     SiteLocation: If(IsBlank(cmbRegSite_EvQ.Selected.Value), Blank(), {Value: cmbRegSite_EvQ.Selected.Value}),
                                     Question1: If(IsBlank(cmbRegQ1_EvQ.Selected.Value), Blank(), {Value: cmbRegQ1_EvQ.Selected.Value}),
                                     Question2: If(IsBlank(cmbRegQ2_EvQ.Selected.Value), Blank(), {Value: cmbRegQ2_EvQ.Selected.Value}),
                                     Status: "Confirmed"})));
                        Set(varWasSwitch, Coalesce(varEvqSwitchRegID, 0) > 0);
                        With({syncEv: LookUp(EventSessionRegistration_Events, ID = varNewReg.EventID)},
                            If(!IsBlank(Trim(Coalesce(syncEv.SPSiteURL, ""))) && !IsBlank(Trim(Coalesce(syncEv.SPListName, ""))),
                                If(IsError(
                                    EventSession_SyncExternalList.Run(
                                        If(varWasSwitch, "Switch", "Register"), varNewReg.ID,
                                        Trim(syncEv.SPSiteURL), Trim(syncEv.SPListName), "Confirmed",
                                        Text(varNewReg.EventID), Coalesce(varNewReg.EventName, ""),
                                        Text(varNewReg.SessionDate, "yyyy-mm-dd"), Coalesce(varNewReg.TimeSlot, ""),
                                        Coalesce(varNewReg.UserName, ""), Lower(Coalesce(varNewReg.UserEmail, "")),
                                        If(Coalesce(varNewReg.ForSelf, true), "Yes", "No"),
                                        Lower(Coalesce(varNewReg.SubmittedBy.Email, "")),
                                        Coalesce(varNewReg.PhoneNumber, ""),
                                        Coalesce(varNewReg.DepartmentName.Value, ""),
                                        Coalesce(varNewReg.SiteLocation.Value, ""),
                                        Coalesce(varNewReg.Question1.Value, ""),
                                        Coalesce(varNewReg.Question2.Value, ""))),
                                    Notify("Saved, but the event's external list could not be updated.", NotificationType.Warning))));
                        With({link: Coalesce(varEventDetail.MeetingLink, "")},
                            If(IsError(
                                EventSession_SendAppEmail.Run(
                                    varNewReg.UserEmail,
                                    If(varWasSwitch, "Session Switched - ", "Registration Confirmed - ") &
                                        Coalesce(varNewReg.EventName, "Session") & " (WSR-" & Text(varNewReg.ID) & ")",
                                    "Hi " & varNewReg.UserName & "," & Char(10) & Char(10) &
                                    If(varWasSwitch,
                                        "Your registration has been moved to the session below.",
                                        "Your registration is confirmed.") & Char(10) & Char(10) &
                                    "Event: " & Coalesce(varNewReg.EventName, "—") & Char(10) &
                                    "Date: " & Text(varNewReg.SessionDate, "dddd, mmmm d, yyyy") & Char(10) &
                                    "Time: " & varNewReg.TimeSlot & Char(10) &
                                    "Reference: WSR-" & Text(varNewReg.ID) &
                                    If(link = "", "", Char(10) & "Meeting link: " & link))),
                                Notify("Registered, but the confirmation email could not be sent.", NotificationType.Warning)));
                        Set(varEvqSwitchRegID, 0);
                        Set(varEvqSwitchRegLabel, "");
                        Set(varShowRegModal_EvQ, false);
                        Reset(txtRegPhone_EvQ); Reset(cmbRegDept_EvQ); Reset(cmbRegSite_EvQ); Reset(cmbRegQ1_EvQ); Reset(cmbRegQ2_EvQ);
                        Set(varRegForSelf, true); Set(varRegOnBehalf, Blank()); Reset(txtRegWhoSearch_EvQ);
                        ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
                        ClearCollect(colMyEvRegs_EvQ, SortByColumns(Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, UserEmail = Lower(User().Email), Status = "Confirmed"), "SessionDate", SortOrder.Ascending)); ClearCollect(colOthersTmp_EvQ, Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, Status = "Confirmed")); ClearCollect(colOthersRegs_EvQ, SortByColumns(Filter(colOthersTmp_EvQ, Lower(Coalesce(SubmittedBy.Email, "")) = Lower(User().Email) && Lower(UserEmail) <> Lower(User().Email)), "SessionDate", SortOrder.Ascending)); ClearCollect(colAllRegs_EvQ, colMyEvRegs_EvQ); Collect(colAllRegs_EvQ, colOthersRegs_EvQ);
                        Set(varEvqSelSlot, Blank());
                        Set(varShowConfModal_EvQ, true)))
