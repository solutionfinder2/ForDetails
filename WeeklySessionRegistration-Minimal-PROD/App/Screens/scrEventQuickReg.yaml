                                                     CutoffH: ThisItem.CutoffH});
                                                Set(varRegModalStep, If(Coalesce(varEvqSwitchRegID, 0) > 0 || !Coalesce(varEventDetail.AllowRegisterForOthers, true), 2, 1)); Set(varRegOnBehalf, Blank()); If(Coalesce(varEvqSwitchRegID, 0) = 0, Set(varRegTargetEmail, Lower(User().Email)); Set(varRegTargetName, User().FullName); Set(varRegPrefill, Blank())); Set(varRegForSelf, Lower(Coalesce(varRegTargetEmail, Lower(User().Email))) = Lower(User().Email)); Reset(txtRegPhone_EvQ); Reset(cmbRegDept_EvQ); Reset(cmbRegSite_EvQ); Reset(cmbRegQ1_EvQ); Reset(cmbRegQ2_EvQ); Set(varShowRegModal_EvQ, true))
                                    - recSlotDivider_EvQ:
