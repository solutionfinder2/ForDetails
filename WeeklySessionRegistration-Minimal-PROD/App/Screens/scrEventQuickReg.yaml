                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowCancelEvQ, false)
            - btnCancelEvQConfirm:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel Registration"
                  X: =Parent.Width - 198
                  Y: =Parent.Height - 76
                  Width: =174
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Outline
                  Color: =RGBA(216, 75, 82, 1)
                  BorderColor: =RGBA(239, 183, 187, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =Patch(EventSessionRegistration_Registrations,
                        LookUp(EventSessionRegistration_Registrations, ID = varCancelTarget.ID),
                        {Status: "Cancelled"});
                    With({syncEv: LookUp(EventSessionRegistration_Events, ID = varCancelTarget.EventID)},
                        If(!IsBlank(Trim(Coalesce(syncEv.SPSiteURL, ""))) && !IsBlank(Trim(Coalesce(syncEv.SPListName, ""))),
                            If(IsError(
                                EventSession_SyncExternalList.Run(
                                    "Cancel", varCancelTarget.ID,
                                    Trim(syncEv.SPSiteURL), Trim(syncEv.SPListName), "Cancelled",
                                    Text(varCancelTarget.EventID), Coalesce(varCancelTarget.EventName, ""),
                                    Text(varCancelTarget.SessionDate, "yyyy-mm-dd"), Coalesce(varCancelTarget.TimeSlot, ""),
                                    Coalesce(varCancelTarget.UserName, ""), Lower(Coalesce(varCancelTarget.UserEmail, "")),
                                    If(Coalesce(varCancelTarget.ForSelf, true), "Yes", "No"),
                                    Lower(Coalesce(varCancelTarget.SubmittedBy.Email, "")),
                                    Coalesce(varCancelTarget.PhoneNumber, ""),
                                    Coalesce(varCancelTarget.DepartmentName.Value, ""),
                                    Coalesce(varCancelTarget.SiteLocation.Value, ""),
                                    Coalesce(varCancelTarget.Question1.Value, ""),
                                    Coalesce(varCancelTarget.Question2.Value, ""))),
                                Notify("Cancelled, but the event's external list could not be updated.", NotificationType.Warning))));
                    If(IsError(
                        EventSession_SendAppEmail.Run(
                            varCancelTarget.UserEmail,
                            "Registration Cancelled - " & Coalesce(varCancelTarget.EventName, "Session") & " (WSR-" & Text(varCancelTarget.ID) & ")",
                            "Hi " & varCancelTarget.UserName & "," & Char(10) & Char(10) &
                            "Your registration has been cancelled." & Char(10) & Char(10) &
                            "Event: " & Coalesce(varCancelTarget.EventName, "—") & Char(10) &
                            "Date: " & Text(varCancelTarget.SessionDate, "dddd, mmmm d, yyyy") & Char(10) &
                            "Time: " & varCancelTarget.TimeSlot & Char(10) &
                            "Reference: WSR-" & Text(varCancelTarget.ID))),
                        Notify("Cancelled, but the notification email could not be sent.", NotificationType.Warning));
                    Set(varShowCancelEvQ, false);
                    ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
                    ClearCollect(colMyEvRegs_EvQ, SortByColumns(Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, UserEmail = Lower(User().Email), Status = "Confirmed"), "SessionDate", SortOrder.Ascending)); ClearCollect(colOthersTmp_EvQ, Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, Status = "Confirmed")); ClearCollect(colOthersRegs_EvQ, SortByColumns(Filter(colOthersTmp_EvQ, Lower(Coalesce(SubmittedBy.Email, "")) = Lower(User().Email) && Lower(UserEmail) <> Lower(User().Email)), "SessionDate", SortOrder.Ascending)); ClearCollect(colAllRegs_EvQ, colMyEvRegs_EvQ); Collect(colAllRegs_EvQ, colOthersRegs_EvQ);
                    Notify("Registration cancelled. The seat is now available.", NotificationType.Success)
