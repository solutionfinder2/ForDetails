# =============================================================
# scrEventQuickReg - Event details WITH ON-SCREEN REGISTRATION
# (MINIMAL EDITION - this is the only user-facing event screen)
#   - Register buttons open a Confirm Registration modal on this screen.
#   - Switch (on My Registration cards or a "Registered" session) turns on
#     switch mode - a banner appears, the user picks the new session, and
#     the same modal confirms the move (old registration is re-pointed).
#   - Success shows a Confirmation modal.
# Validation: capacity re-check, duplicate/clash check, MaxPerUser limit,
# registration cutoff (waived for switches). Confirmation, switch, and
# cancel emails are sent via EventSession_SendAppEmail with
# HARDCODED subject/body - the EmailTemplates list is NOT used in this
# edition (pair it with the NoTemplates flow package).
# Navigate here with:
#   Set(varDetailEventID, <event ID>); Navigate(scrEventQuickReg, ScreenTransition.Fade)
# The Back button returns to the previous screen (Intro or Admin).
# =============================================================
Screens:
  scrEventQuickReg:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =Set(varEventDetail, LookUp(EventSessionRegistration_Events, ID = varDetailEventID));
        ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
        ClearCollect(colEvqSlots, Filter(EventSessionRegistration_SessionTimeSlots, EventID = varDetailEventID, IsActive = true, SessionDate >= Today()));
        ClearCollect(colMyEvRegs_EvQ, SortByColumns(Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, UserEmail = Lower(User().Email), Status = "Confirmed"), "SessionDate", SortOrder.Ascending)); ClearCollect(colOthersTmp_EvQ, Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, Status = "Confirmed")); ClearCollect(colOthersRegs_EvQ, SortByColumns(Filter(colOthersTmp_EvQ, Lower(Coalesce(SubmittedBy.Email, "")) = Lower(User().Email) && Lower(UserEmail) <> Lower(User().Email)), "SessionDate", SortOrder.Ascending)); ClearCollect(colAllRegs_EvQ, colMyEvRegs_EvQ); Collect(colAllRegs_EvQ, colOthersRegs_EvQ);
        Set(varEvqSelSlot, Blank());
        Set(varEvqView, "calendar");
        Set(varEvqCalSel, Coalesce(First(SortByColumns(colEvqSlots, "SessionDate", SortOrder.Ascending)).SessionDate, Today()));
        Set(varEvqCalMonth, Date(Year(varEvqCalSel), Month(varEvqCalSel), 1));
        Set(varEvqSwitchRegID, 0);
        Set(varEvqSwitchRegLabel, "");
        Set(varShowRegModal_EvQ, false);
        Set(varShowConfModal_EvQ, false);
        Set(varShowCancelEvQ, false);
        Set(varShowShareEvQ, false)
    Children:
      - imgBackground_EvQ:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_EvQ:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =28
            PaddingRight: =28
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- HEADER: back + title ----------------
            - conHeader_EvQ:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =44
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =14
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  - btnBack_EvQ:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="← Back"
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =If(varDeepEvent,
                              Set(varDeepEvent, false); Navigate(scrIntro, ScreenTransition.Fade),
                              Back(ScreenTransition.Fade))
                  - lblHeader_EvQ:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Event Details"
                        Height: =40
                        FillPortions: =1
                        Size: =18
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
                  - btnShare_EvQ:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="↗ Share"
                        Width: =110
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        Visible: =!IsBlank(varEventDetail)
                        OnSelect: =Clear(colShareEvQTo); Reset(txtShareEvQSearch); Set(varShowShareEvQ, true)
                  - lblStatusChip_EvQ:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: |-
                          =If(IsBlank(varEventDetail), "",
                              varEventDetail.StartDate > Today(), "Upcoming",
                              varEventDetail.EndDate >= Today(), "In Progress",
                              "Ended")
                        Width: =120
                        Height: =30
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        Fill: |-
                          =If(IsBlank(varEventDetail), RGBA(0, 0, 0, 0),
                              varEventDetail.StartDate > Today(), RGBA(233, 248, 241, 1),
                              varEventDetail.EndDate >= Today(), RGBA(255, 244, 223, 1),
                              RGBA(238, 240, 246, 1))
                        Color: |-
                          =If(IsBlank(varEventDetail), RGBA(0, 0, 0, 0),
                              varEventDetail.StartDate > Today(), RGBA(21, 150, 106, 1),
                              varEventDetail.EndDate >= Today(), RGBA(199, 122, 0, 1),
                              RGBA(104, 115, 138, 1))
                        RadiusTopLeft: =15
                        RadiusTopRight: =15
                        RadiusBottomLeft: =15
                        RadiusBottomRight: =15
            # ---------------- BODY: two columns ----------------
            - conBody_EvQ:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  LayoutWrap: =true
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  # LEFT column: hero + sessions
                  - conLeftCol_EvQ:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =2
                        LayoutMinWidth: =420
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        # Hero card
                        - conHero_EvQ:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =304
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =6
                              PaddingTop: =20
                              PaddingBottom: =16
                              PaddingLeft: =22
                              PaddingRight: =22
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - lblEvName_EvQ:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =If(IsBlank(varEventDetail), "Event not found", varEventDetail.Title)
                                    Height: =32
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblEvMeta_EvQ:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      =If(IsBlank(varEventDetail), "",
                                          Text(varEventDetail.StartDate, "ddd, mmm d") & " – " & Text(varEventDetail.EndDate, "ddd, mmm d, yyyy") &
                                          If(IsBlank(varEventDetail.EventType), "", "  ·  " & varEventDetail.EventType) &
                                          If(IsBlank(varEventDetail.Location), "", "  ·  ⌖ " & varEventDetail.Location) &
                                          If(IsBlank(varEventDetail.Department), "", "  ·  " & varEventDetail.Department))
                                    Height: =24
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(55, 63, 75, 1)
                              - recHeroDiv_EvQ:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =""
                                    Height: =1
                                    FillPortions: =0
                                    Fill: =RGBA(228, 231, 239, 1)
                              - lblMyRegHead_EvQ:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      ="My Registration" & If(CountRows(colMyEvRegs_EvQ) > 1, "s (" & CountRows(colMyEvRegs_EvQ) & ")", "")
                                    Height: =24
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =14
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(23, 32, 51, 1)
                              - conMyRegTabs_EvQ:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =36
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - btnMyRegTabAll_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="All (" & (CountRows(colMyEvRegs_EvQ) + CountRows(colOthersRegs_EvQ)) & ")"
                                          Width: =90
                                          Height: =32
                                          FillPortions: =0
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =If(Coalesce(varMyRegTab_EvQ, "all") = "all", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: =Set(varMyRegTab_EvQ, "all")
                                    - btnMyRegTabMine_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="Mine (" & CountRows(colMyEvRegs_EvQ) & ")"
                                          Width: =130
                                          Height: =32
                                          FillPortions: =0
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =If(varMyRegTab_EvQ = "mine", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: =Set(varMyRegTab_EvQ, "mine")
                                    - btnMyRegTabOthers_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="For others (" & CountRows(colOthersRegs_EvQ) & ")"
                                          Width: =150
                                          Height: =32
                                          FillPortions: =0
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =If(varMyRegTab_EvQ = "others", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          Visible: =Coalesce(varEventDetail.AllowRegisterForOthers, true) || CountRows(colOthersRegs_EvQ) > 0
                                          OnSelect: =Set(varMyRegTab_EvQ, "others")
                              - lblNoMyReg_EvQ:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      =Switch(Coalesce(varMyRegTab_EvQ, "all"),
                                          "others", "You haven't registered anyone else for this event yet.",
                                          "mine", "You haven't registered for this event yet. Pick a session below to register.",
                                          "No registrations yet for this event. Pick a session below to register.")
                                    Height: =48
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Wrap: =true
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Color: =RGBA(104, 115, 138, 1)
                                    Fill: =RGBA(246, 247, 251, 1)
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    Visible: =Switch(Coalesce(varMyRegTab_EvQ, "all"), "others", IsEmpty(colOthersRegs_EvQ), "mine", IsEmpty(colMyEvRegs_EvQ), IsEmpty(colMyEvRegs_EvQ) && IsEmpty(colOthersRegs_EvQ))
                              - galMyEvRegs_EvQ:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    TemplateSize: =330
                                    TemplatePadding: =4
                                    ShowScrollbar: =false
                                    Visible: =Switch(Coalesce(varMyRegTab_EvQ, "all"), "others", !IsEmpty(colOthersRegs_EvQ), "mine", !IsEmpty(colMyEvRegs_EvQ), !(IsEmpty(colMyEvRegs_EvQ) && IsEmpty(colOthersRegs_EvQ)))
                                    Items: =Switch(Coalesce(varMyRegTab_EvQ, "all"), "others", colOthersRegs_EvQ, "mine", colMyEvRegs_EvQ, SortByColumns(colAllRegs_EvQ, "SessionDate", SortOrder.Ascending))
                                  Children:
                                    - recMyRegCard_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =""
                                          X: =0
                                          Y: =2
                                          Width: =Parent.TemplateWidth - 10
                                          Height: =Parent.TemplateHeight - 6
                                          Fill: =RGBA(246, 247, 251, 1)
                                          BorderColor: =RGBA(228, 231, 239, 1)
                                          BorderThickness: =1
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                    - recMyRegDateBox_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =""
                                          X: =12
                                          Y: =14
                                          Width: =48
                                          Height: =48
                                          Fill: =RGBA(232, 234, 238, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                    - lblMyRegMon_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Upper(Text(ThisItem.SessionDate, "mmm"))
                                          X: =12
                                          Y: =18
                                          Width: =48
                                          Height: =16
                                          AutoHeight: =true
                                          Size: =10
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          Color: =RGBA(55, 63, 75, 1)
                                    - lblMyRegDay_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Text(ThisItem.SessionDate, "dd")
                                          X: =12
                                          Y: =33
                                          Width: =48
                                          Height: =24
                                          AutoHeight: =true
                                          Size: =14
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          Color: =RGBA(55, 63, 75, 1)
                                    - recMyRegAv_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Upper(Left(Trim(ThisItem.UserName), 1))
                                          X: =70
                                          Y: =12
                                          Width: =28
                                          Height: =28
                                          Size: =11
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          Fill: =RGBA(232, 234, 238, 1)
                                          Color: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                    - imgMyRegAv_EvQ:
                                        Control: Image
                                        Properties:
                                          Image: |-
                                            =If(Lower(ThisItem.UserEmail) = Lower(User().Email) && !IsBlank(User().Image), User().Image,
                                                IfError(Office365Users.UserPhotoV2(Lower(ThisItem.UserEmail)), Blank()))
                                          X: =70
                                          Y: =12
                                          Width: =28
                                          Height: =28
                                          ImagePosition: =ImagePosition.Fill
                                          RadiusTopLeft: =14
                                          RadiusTopRight: =14
                                          RadiusBottomLeft: =14
                                          RadiusBottomRight: =14
                                    - lblMyRegFor_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: |-
                                            =If(Lower(ThisItem.UserEmail) = Lower(User().Email),
                                                ThisItem.UserName & " (You)",
                                                "For: " & ThisItem.UserName)
                                          X: =104
                                          Y: =16
                                          Width: =Parent.TemplateWidth - 232
                                          Height: =20
                                          AutoHeight: =true
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Color: =RGBA(55, 63, 75, 1)
                                          Visible: =true
                                    - lblMyRegBadge_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =If(ThisItem.SessionDate < Today(), "Past", "Confirmed ✓")
                                          X: =Parent.TemplateWidth - 122
                                          Y: =14
                                          Width: =104
                                          Height: =22
                                          AutoHeight: =true
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          Fill: |-
                                            =If(ThisItem.SessionDate < Today(),
                                                RGBA(238, 240, 246, 1), RGBA(233, 248, 241, 1))
                                          Color: |-
                                            =If(ThisItem.SessionDate < Today(),
                                                RGBA(104, 115, 138, 1), RGBA(21, 150, 106, 1))
                                          RadiusTopLeft: =11
                                          RadiusTopRight: =11
                                          RadiusBottomLeft: =11
                                          RadiusBottomRight: =11
                                    - lblMyRegTime_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Text(ThisItem.SessionDate, "ddd, mmm d")
                                          X: =70
                                          Y: =40
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =20
                                          AutoHeight: =true
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                    - lblMyRegRef_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =ThisItem.TimeSlot & "  ·  WSR-" & Text(ThisItem.ID)
                                          X: =70
                                          Y: =62
                                          Width: =Parent.TemplateWidth - 90
                                          Height: =18
                                          AutoHeight: =true
                                          Size: =11
                                          Color: =RGBA(104, 115, 138, 1)
                                    - btnMyRegCancel_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="Cancel"
                                          X: =12
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Outline
                                          Color: =RGBA(216, 75, 82, 1)
                                          BorderColor: =RGBA(239, 183, 187, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =Set(varCancelTarget, ThisItem);
                                            Set(varShowCancelEvQ, true)
                                    - btnMyRegSwitch_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="⇄ Switch"
                                          X: =12 + (Parent.TemplateWidth - 46) / 3 + 6
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Secondary
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =Set(varEvqSwitchRegID, ThisItem.ID);
                                            Set(varEvqSwitchRegLabel, Text(ThisItem.SessionDate, "ddd, mmm d") & " · " & ThisItem.TimeSlot);
                                            Set(varRegTargetEmail, Lower(ThisItem.UserEmail));
                                            Set(varRegTargetName, ThisItem.UserName);
                                            Set(varRegPrefill, ThisItem);
                                            Set(varEvqSelSlot, Blank());
                                            Notify("Switch mode on — pick a new session from the list or calendar below, then confirm.", NotificationType.Information)
                                    - btnMyRegAddCal_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="📅 Calendar"
                                          Visible: =Lower(ThisItem.UserEmail) = Lower(User().Email)
                                          X: =12 + 2 * ((Parent.TemplateWidth - 46) / 3 + 6)
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Secondary
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =With({p: Split(ThisItem.TimeSlot, " – "),
                                                  ml: Coalesce(varEventDetail.MeetingLink, ""),
                                                  loc: Coalesce(varEventDetail.Location, "")},
                                                With({startDT: ThisItem.SessionDate + IfError(TimeValue(First(p).Value), Time(9, 0, 0)),
                                                      endDT: ThisItem.SessionDate + IfError(TimeValue(Last(p).Value), Time(15, 0, 0))},
                                                    If(IsError(
                                                        EventSession_AddToCalendar.Run(
                                                            Coalesce(ThisItem.EventName, "Session") & " - " & ThisItem.TimeSlot,
                                                            "Your registered session." & Char(10) &
                                                                "Event: " & Coalesce(ThisItem.EventName, "") & Char(10) &
                                                                "Time: " & ThisItem.TimeSlot & Char(10) &
                                                                "Reference: WSR-" & ThisItem.ID &
                                                                If(ml = "", "", Char(10) & "Meeting link: " & ml),
                                                            Text(startDT, "yyyy-mm-ddThh:mm:ss"),
                                                            Text(endDT, "yyyy-mm-ddThh:mm:ss"),
                                                            loc)),
                                                        Notify("Could not add to your calendar. Check that the EventSession_AddToCalendar flow is connected.", NotificationType.Error),
                                                        Notify("Added to your Outlook calendar.", NotificationType.Success))))
                        # Sessions card
                        - conSessions_EvQ:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              PaddingTop: =16
                              PaddingBottom: =12
                              PaddingLeft: =22
                              PaddingRight: =22
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - conSessHead_EvQ:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =40
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    Fill: =RGBA(0, 0, 0, 0)
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblSessionsHead_EvQ:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: ="Upcoming Sessions (" & CountRows(colEvqSlots) & ")"
                                          Height: =28
                                          FillPortions: =1
                                          Size: =13
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                    - btnCalFilterAll_EvQ:
                                        Control: ModernButton@1.0.0
                                        Properties:
