                              Width: =Parent.TemplateWidth - 140
                              Height: =22
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - btnCancelReg_MyReg:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Cancel Registration"
                              X: =24
                              Y: =136
                              Width: =(Parent.TemplateWidth - 58) / 2
                              Height: =38
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Outline
                              Color: =RGBA(216, 75, 82, 1)
                              BorderColor: =RGBA(239, 183, 187, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varCancelTarget, ThisItem);
                                Set(varShowCancelModal, true)
                        - btnViewDetails_MyReg:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Event Details"
                              X: =24 + (Parent.TemplateWidth - 58) / 2 + 10
                              Y: =182
                              Width: =(Parent.TemplateWidth - 58) / 2
                              Height: =38
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =If(IsBlank(ThisItem.EventID),
                                    Notify("This registration isn't linked to an event.", NotificationType.Information),
                                    Set(varDetailEventID, ThisItem.EventID);
                                    Navigate(scrEventDetails, ScreenTransition.Fade))
                        - btnSwitch_MyReg:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Switch Session"
                              X: =24 + (Parent.TemplateWidth - 58) / 2 + 10
                              Y: =136
                              Width: =(Parent.TemplateWidth - 58) / 2
                              Height: =38
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varSwitchRegID, ThisItem.ID);
                                Set(varSwitchRegLabel, Text(ThisItem.SessionDate, "ddd, mmm d") & " · " & ThisItem.TimeSlot);
                                Set(varSelectedEvent,
                                    With({e: LookUp(EventSessionRegistration_Events, ID = ThisItem.EventID)},
                                        {ID: e.ID, Title: e.Title, Description: e.Description,
                                         StartDate: e.StartDate, EndDate: e.EndDate, Location: e.Location,
                                         EventType: e.EventType, CutoffHours: Coalesce(e.RegistrationCutoffHours, 48),
                                         MaxPerUser: Coalesce(e.MaxPerUser, 0), MeetingLink: e.MeetingLink,
                                         Coordinator: e.Coordinator, POC: e.POC, POCEmail: e.POCEmail}));
                                Set(varDetailEvent, varSelectedEvent);
                                Set(varSelectedSlot, Blank());
                                Set(varCalDate, ThisItem.SessionDate);
                                Set(varDeepLink, true);
                                Navigate(scrRegister, ScreenTransition.Fade)
                        - btnAddCal_MyReg:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Add to Calendar"
                              X: =24
                              Y: =182
                              Width: =(Parent.TemplateWidth - 58) / 2
                              Height: =38
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =With({p: Split(ThisItem.TimeSlot, " – "),
                                      ml: Coalesce(LookUp(EventSessionRegistration_Events, ID = ThisItem.EventID, MeetingLink), ""),
                                      loc: Coalesce(LookUp(EventSessionRegistration_Events, ID = ThisItem.EventID, Location), "")},
                                    With({startDT: ThisItem.SessionDate + IfError(TimeValue(First(p).Value), Time(9, 0, 0)),
                                          endDT: ThisItem.SessionDate + IfError(TimeValue(Last(p).Value), Time(15, 0, 0))},
                                        If(IsError(
                                            EventSessionRegistration_AddToCalendar.Run(
                                                Coalesce(ThisItem.EventName, "Session") & " - " & ThisItem.TimeSlot,
                                                "Your registered session." & Char(10) &
                                                    "Event: " & Coalesce(ThisItem.EventName, "") & Char(10) &
                                                    "Time: " & ThisItem.TimeSlot & Char(10) &
                                                    "Reference: WSR-" & ThisItem.ID &
                                                    If(ml = "", "", Char(10) & "Meeting link: " & ml),
                                                Text(startDT, "yyyy-mm-ddThh:mm:ss"),
                                                Text(endDT, "yyyy-mm-ddThh:mm:ss"),
                                                loc)),
                                            Notify("Could not add to your calendar. Check that the EventSessionRegistration_AddToCalendar flow is connected.", NotificationType.Error),
                                            Notify("Added to your Outlook calendar.", NotificationType.Success))))
      # ---------------- CANCEL MODAL (screen level, on top) ----------------
      - recModalOverlay_MyReg:
          Control: ModernText@1.0.0
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(20, 24, 42, 0.45)
            Visible: =varShowCancelModal
            OnSelect: =Set(varShowCancelModal, false)
      - conModal_MyReg:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - 480) / 2
            Y: =(Parent.Height - 260) / 2
            Width: =480
            Height: =260
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            Visible: =varShowCancelModal
          Children:
            - lblModalTitle_MyReg:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Cancel Registration?"
                  X: =24
                  Y: =24
                  Width: =Parent.Width - 48
                  Height: =32
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(23, 32, 51, 1)
            - lblModalBody_MyReg:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    ="Are you sure you want to cancel your " &
                    If(IsBlank(varCancelTarget), "session", varCancelTarget.TimeSlot & " session on " & Text(varCancelTarget.SessionDate, "ddd, mmm d")) &
                    "? The seat will become available to another participant."
                  X: =24
                  Y: =60
                  Width: =Parent.Width - 48
                  Height: =100
                  AutoHeight: =true
                  Size: =13
                  Color: =RGBA(104, 115, 138, 1)
                  Wrap: =true
                  VerticalAlign: =VerticalAlign.Top
            - btnModalKeep_MyReg:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Keep Registration"
                  X: =Parent.Width - 368
                  Y: =Parent.Height - 76
                  Width: =160
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowCancelModal, false)
            # -----------------------------------------------------------------
            # BACKUP - trigger the cancel email WITHOUT the EmailTemplates list.
            # In the OnSelect below, replace the whole With({tpl: ...}) block
            # (everything from "With({tpl:" through its closing ")));") with:
            #
            #   If(IsError(
            #       EventSessionRegistration_SendAppEmail.Run(
            #           varCancelTarget.UserEmail,
            #           "Registration Cancelled - " & Coalesce(varCancelTarget.EventName, "Session") &
            #               " (WSR-" & Text(varCancelTarget.ID) & ")",
            #           "Hi " & varCancelTarget.UserName & "," & Char(10) & Char(10) &
            #           "Your registration has been cancelled." & Char(10) & Char(10) &
            #           "Event: " & Coalesce(varCancelTarget.EventName, "—") & Char(10) &
            #           "Date: " & Text(varCancelTarget.SessionDate, "dddd, mmmm d, yyyy") & Char(10) &
            #           "Time: " & varCancelTarget.TimeSlot & Char(10) &
            #           "Reference: WSR-" & Text(varCancelTarget.ID))),
            #       Notify("Cancelled, but the notification email could not be sent.", NotificationType.Warning));
            # -----------------------------------------------------------------
            - btnModalConfirm_MyReg:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel Registration"
                  X: =Parent.Width - 198
                  Y: =Parent.Height - 76
                  Width: =174
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Outline
                  Color: =RGBA(216, 75, 82, 1)
                  BorderColor: =RGBA(239, 183, 187, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =Patch(EventSessionRegistration_Registrations, varCancelTarget, {Status: "Cancelled"});
                    With({tpl: LookUp(EventSessionRegistration_EmailTemplates, TemplateKey = "RegistrationCancelled"),
                          link: Coalesce(LookUp(EventSessionRegistration_Events, ID = varCancelTarget.EventID, MeetingLink), "")},
                        If(IsBlank(tpl),
                            Notify("Cancelled, but no email was sent - the 'RegistrationCancelled' template is missing from the EmailTemplates list.", NotificationType.Warning),
                            tpl.IsActive,
                            If(IsError(
                                EventSessionRegistration_SendAppEmail.Run(
                                    varCancelTarget.UserEmail,
                                    Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(tpl.Subject,
                                        "{UserName}", varCancelTarget.UserName),
                                        "{EventName}", Coalesce(varCancelTarget.EventName, "")),
                                        "{SessionDate}", Text(varCancelTarget.SessionDate, "dddd, mmmm d, yyyy")),
                                        "{TimeSlot}", varCancelTarget.TimeSlot),
                                        "{MeetingLink}", link),
                                        "{ReferenceID}", "WSR-" & Text(varCancelTarget.ID)),
                                    Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(tpl.Body,
                                        "{UserName}", varCancelTarget.UserName),
                                        "{EventName}", Coalesce(varCancelTarget.EventName, "")),
                                        "{SessionDate}", Text(varCancelTarget.SessionDate, "dddd, mmmm d, yyyy")),
                                        "{TimeSlot}", varCancelTarget.TimeSlot),
                                        "{MeetingLink}", link),
                                        "{ReferenceID}", "WSR-" & Text(varCancelTarget.ID)))),
                                Notify("Cancelled, but the notification email could not be sent.", NotificationType.Warning))));
                    Set(varShowCancelModal, false);
                    Notify("Registration cancelled. The seat is now available.", NotificationType.Success)
