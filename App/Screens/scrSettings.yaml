            - lblTplSubjectLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Subject"
                  X: =24
                  Y: =160
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtTplSubject:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =182
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: =Coalesce(varEditTpl.Subject, "")
                  Placeholder: |-
                    ="e.g. Registration confirmed: {EventName} - {SessionDate}"
                  Type: =TextInputType.SingleLine
            - lblTplBodyLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Body (plain text)"
                  X: =24
                  Y: =234
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtTplBody:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =256
                  Width: =Parent.Width - 48
                  Height: =240
                  Size: =13
                  Default: =Coalesce(varEditTpl.Body, "")
                  Placeholder: ="Email body. Use the placeholders listed below."
                  Type: =TextInputType.Multiline
            - lblTplModalPlaceholders:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    ="Placeholders:  {UserName}  {EventName}  {SessionDate}  {TimeSlot}  {MeetingLink}  {ReferenceID}"
                  X: =24
                  Y: =502
                  Width: =Parent.Width - 48
                  Height: =20
                  AutoHeight: =true
                  Size: =12
                  Color: =RGBA(104, 115, 138, 1)
            - btnTplActive:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(varTplActive, "✓ Active - this email will be sent", "○ Inactive - this email is turned off")
                  X: =24
                  Y: =532
                  Width: =320
                  Height: =38
                  Size: =13
                  Appearance: =If(varTplActive, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  BasePaletteColor: =RGBA(38, 124, 87, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varTplActive, !varTplActive)
            - btnTplCancel:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel"
                  X: =Parent.Width - 300
                  Y: =Parent.Height - 64
                  Width: =120
                  Height: =40
                  Size: =13
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowTplModal, false)
            - btnTplSave:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Save Changes"
                  X: =Parent.Width - 168
                  Y: =Parent.Height - 64
                  Width: =144
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =RGBA(55, 63, 75, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(IsBlank(Trim(txtTplSubject.Text)) || IsBlank(Trim(txtTplBody.Text)),
                        Notify("Subject and body are both required.", NotificationType.Warning),
                        Patch(EventSessionRegistration_EmailTemplates, LookUp(EventSessionRegistration_EmailTemplates, ID = varEditTpl.ID),
                            {Title: Trim(txtTplName.Text),
                             Subject: Trim(txtTplSubject.Text),
                             Body: txtTplBody.Text,
                             IsActive: varTplActive});
                        ClearCollect(colEmailTemplates, EventSessionRegistration_EmailTemplates);
                        Set(varShowTplModal, false);
                        Notify("Template saved.", NotificationType.Success))
      # ---------------- ADD USER ROLE MODAL (screen level, on top) ----------------
      - recRoleOverlay:
          Control: ModernText@1.0.0
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(20, 24, 42, 0.45)
            Visible: =varShowRoleModal
            OnSelect: =Set(varShowRoleModal, false)
      - conRoleModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Min(520, Parent.Width - 40)) / 2
            Y: =Max(20, (Parent.Height - 400) / 2)
            Width: =Min(520, Parent.Width - 40)
            Height: =400
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            Visible: =varShowRoleModal
          Children:
            - lblRoleModalTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: =If(varRoleModalMode = "edit", "Edit User Role", "Add User Role")
                  X: =24
                  Y: =20
                  Width: =Parent.Width - 100
                  Height: =28
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(23, 32, 51, 1)
            - btnRoleModalClose:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="✕"
                  X: =Parent.Width - 56
                  Y: =16
                  Width: =40
                  Height: =40
                  Size: =14
                  Appearance: =ButtonAppearance.Subtle
                  OnSelect: =Set(varShowRoleModal, false)
            - lblRoleEmailLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Work email address"
                  X: =24
                  Y: =70
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtRoleEmail:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =92
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: =If(varRoleModalMode = "edit", Lower(Coalesce(varEditRole.UserEmail.Email, "")), "")
                  Placeholder: ="name@org.com"
                  Type: =TextInputType.SingleLine
                  DisplayMode: =If(varRoleModalMode = "edit", DisplayMode.Disabled, DisplayMode.Edit)
            - lblRoleEmailHint:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(varRoleModalMode = "edit",
                        "The email can't be changed here - remove this row and add a new one to move the role to someone else.",
                        "Must be a person in your organization (the list uses a people column, so the email has to resolve to a real account).")
                  X: =24
                  Y: =132
                  Width: =Parent.Width - 48
                  Height: =32
                  AutoHeight: =true
                  Size: =12
                  Wrap: =true
                  Color: =RGBA(104, 115, 138, 1)
            - lblRoleTypeLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Role"
                  X: =24
                  Y: =180
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - btnRoleCoord:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(varNewRoleType = "Coordinator", "✓ Coordinator", "Coordinator")
                  X: =24
                  Y: =202
                  Width: =140
                  Height: =36
                  Size: =13
                  Appearance: =If(varNewRoleType = "Coordinator", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  BasePaletteColor: =RGBA(38, 124, 87, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varNewRoleType, "Coordinator")
            - btnRoleAdmin:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(varNewRoleType = "Admin", "✓ Admin", "Admin")
                  X: =172
                  Y: =202
                  Width: =120
                  Height: =36
                  Size: =13
                  Appearance: =If(varNewRoleType = "Admin", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  BasePaletteColor: =RGBA(31, 91, 189, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varNewRoleType, "Admin")
            - lblRoleTypeHint:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    ="Coordinator: runs events and sees the Admin dashboard. Admin: everything, including this settings page."
                  X: =24
                  Y: =248
                  Width: =Parent.Width - 48
                  Height: =32
                  AutoHeight: =true
                  Size: =12
                  Wrap: =true
                  Color: =RGBA(104, 115, 138, 1)
            - btnRoleCancel:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel"
                  X: =Parent.Width - 300
                  Y: =Parent.Height - 64
                  Width: =120
                  Height: =40
                  Size: =13
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowRoleModal, false)
            - btnRoleSave:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(varRoleModalMode = "edit", "Save Changes", "Add User")
                  X: =Parent.Width - 168
                  Y: =Parent.Height - 64
                  Width: =144
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =RGBA(55, 63, 75, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(varRoleModalMode = "edit",
                        If(IsError(
                            Patch(EventSessionRegistration_AppRoles,
                                LookUp(EventSessionRegistration_AppRoles, ID = varEditRole.ID),
                                {Role: {Value: varNewRoleType}})),
                            Notify("Could not update the role. Try again.", NotificationType.Error),
                            ClearCollect(colAppRoles, EventSessionRegistration_AppRoles);
                            Set(varShowRoleModal, false);
                            If(Lower(Coalesce(varEditRole.UserEmail.Email, "")) = Lower(User().Email) && varNewRoleType <> "Admin",
                                Notify("Role changed to " & varNewRoleType & ". WARNING - this is your own account: you'll lose access to this settings page the next time you open the app.", NotificationType.Warning),
                                Notify("Role changed to " & varNewRoleType & ". Takes effect the next time they open the app.", NotificationType.Success))),
                    !IsMatch(Trim(txtRoleEmail.Text), Match.Email),
                        Notify("Enter a valid email address.", NotificationType.Warning),
                        !IsBlank(LookUp(colAppRoles, Lower(Coalesce(UserEmail.Email, "")) = Lower(Trim(txtRoleEmail.Text)))),
                        Notify("That user is already in the list. Use Edit on their row to change their role.", NotificationType.Warning),
                        If(IsError(
                            Patch(EventSessionRegistration_AppRoles, Defaults(EventSessionRegistration_AppRoles),
                                {Title: Trim(txtRoleEmail.Text),
                                 UserEmail: {
                                     '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                     Claims: "i:0#.f|membership|" & Lower(Trim(txtRoleEmail.Text)),
                                     DisplayName: Trim(txtRoleEmail.Text),
                                     Email: Lower(Trim(txtRoleEmail.Text)),
                                     Department: "",
                                     JobTitle: "",
                                     Picture: ""},
                                 Role: {Value: varNewRoleType}})),
                            Notify("Could not add that user. Check the email belongs to someone in your organization.", NotificationType.Error),
                            ClearCollect(colAppRoles, EventSessionRegistration_AppRoles);
                            Set(varShowRoleModal, false);
                            Notify("Added as " & varNewRoleType & ". Takes effect the next time they open the app.", NotificationType.Success)))
