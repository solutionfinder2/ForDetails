# =============================================================
# scrSettings - Application Settings (RESPONSIVE, MODERN CONTROLS)
# Admin drill-in page (no sidebar) reached from the gear button on
# the Admin screen header. Back returns to the previous screen.
#
# Tabs: Email Templates, User Roles (more tabs can be added later -
# follow the varSettingsTab pattern).
#
# Email Templates tab: manages the EventSessionRegistration_EmailTemplates SharePoint list.
# Each row is one email the app sends (registration confirmed,
# session switched, registration cancelled, session reminder).
# Admins edit the subject/body; placeholders like {UserName} are
# replaced with real values at send time. The actual sending happens
# through the EventSession_SendAppEmail flow (see Flow/SendAppEmail-Flow.md).
#
# User Roles tab: manages the EventSessionRegistration_AppRoles SharePoint list
# (who is an Admin or Coordinator). Add by email; remove with a
# confirmation. NOTE: while the list is EMPTY the app treats everyone
# as an Admin (bootstrap). Roles are read in App.OnStart, so changes
# take effect the next time an affected user opens the app.
#
# Promote Event tab: pick ONE event to feature on the welcome (Intro)
# page (Events.IsPromoted). Audience-restricted events are excluded
# because the Intro page is visible to everyone.
# =============================================================
Screens:
  scrSettings:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =If(varIsAdmin,
            ClearCollect(colEmailTemplates, EventSessionRegistration_EmailTemplates);
            ClearCollect(colAppRoles, EventSessionRegistration_AppRoles);
            ClearCollect(colPromoEvents, Filter(EventSessionRegistration_Events, IsActive = true, EndDate >= Today()));
            Set(varSettingsTab, "email");
            Set(varShowTplModal, false);
            Set(varShowRoleModal, false);
            Set(varShowRoleRemove, false))
    Children:
      - imgBackground_Set:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_Set:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =28
            PaddingRight: =28
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- HEADER: back + title ----------------
            - conHeader_Set:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =44
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =14
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  - btnBack_Set:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="← Back"
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Back(ScreenTransition.Fade)
                  - lblHeader_Set:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Application Settings"
                        Height: =40
                        FillPortions: =1
                        Size: =18
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
            # ---------------- TAB BAR ----------------
            - conTabs_Set:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =44
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  - btnTabEmail_Set:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="Email Templates"
                        Width: =150
                        Height: =36
                        FillPortions: =0
                        Size: =13
                        Appearance: =If(varSettingsTab = "email", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Set(varSettingsTab, "email")
                  - btnTabRoles_Set:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="User Roles"
                        Width: =120
                        Height: =36
                        FillPortions: =0
                        Size: =13
                        Appearance: =If(varSettingsTab = "roles", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Set(varSettingsTab, "roles")
                  - btnTabPromote_Set:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="Promote Event"
                        Width: =140
                        Height: =36
                        FillPortions: =0
                        Size: =13
                        Appearance: =If(varSettingsTab = "promote", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Set(varSettingsTab, "promote")
            # ---------------- EMAIL TEMPLATES PANEL ----------------
            - conTplPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(228, 231, 239, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  Visible: =varSettingsTab = "email"
                Children:
                  - lblTplPanelTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Email Templates"
                        Height: =24
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
                  - lblTplPanelSub:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="These emails are sent automatically when a user registers, switches, or cancels a session. Edit the wording below - changes take effect immediately."
                        Height: =20
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Color: =RGBA(104, 115, 138, 1)
                  - lblTplPlaceholders:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: |-
                          ="Placeholders you can use in subjects and bodies:  {UserName}   {EventName}   {SessionDate}   {TimeSlot}   {MeetingLink}   {ReferenceID}  - each is replaced with the real value when the email is sent."
                        Height: =54
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =12
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingLeft: =14
                        PaddingRight: =14
                        Color: =RGBA(70, 79, 96, 1)
                        Fill: =RGBA(243, 244, 249, 1)
                  # Table header
                  - conTplHead:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Height: =28
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblTColName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="EMAIL"
                              X: =Parent.Width * 0.02
                              Y: =0
                              Width: =Parent.Width * 0.20
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblTColKey:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="SENT WHEN"
                              X: =Parent.Width * 0.23
                              Y: =0
                              Width: =Parent.Width * 0.22
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblTColSubject:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="SUBJECT"
                              X: =Parent.Width * 0.46
                              Y: =0
                              Width: =Parent.Width * 0.32
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblTColStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="STATUS"
                              X: =Parent.Width * 0.79
                              Y: =0
                              Width: =Parent.Width * 0.09
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblTColActions:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="ACTIONS"
                              X: =Parent.Width - 84
                              Y: =0
                              Width: =76
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Align: =Align.Right
                              Color: =RGBA(104, 115, 138, 1)
                  - galTemplates:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        ShowScrollbar: =false
                        TemplateSize: =60
                        TemplatePadding: =0
                        Items: =SortByColumns(colEmailTemplates, "Title", SortOrder.Ascending)
                      Children:
                        - lblTRowName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Title
                              X: =Parent.TemplateWidth * 0.02
                              Y: =18
                              Width: =Parent.TemplateWidth * 0.20
                              Height: =24
                              AutoHeight: =true
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(23, 32, 51, 1)
                        - lblTRowKey:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                =Switch(ThisItem.TemplateKey,
                                    "RegistrationConfirmed", "A user registers for a session",
                                    "SessionSwitched", "A user switches to another session",
                                    "RegistrationCancelled", "A registration is cancelled",
                                    "SessionReminder", "Scheduled reminder (via flow)",
                                    ThisItem.TemplateKey)
                              X: =Parent.TemplateWidth * 0.23
                              Y: =18
                              Width: =Parent.TemplateWidth * 0.22
                              Height: =24
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblTRowSubject:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Subject
                              X: =Parent.TemplateWidth * 0.46
                              Y: =18
                              Width: =Parent.TemplateWidth * 0.32
                              Height: =24
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(70, 79, 96, 1)
                        - lblTRowStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =If(ThisItem.IsActive, "ACTIVE", "OFF")
                              X: =Parent.TemplateWidth * 0.79
                              Y: =16
                              Width: =Parent.TemplateWidth * 0.08
                              Height: =26
                              AutoHeight: =true
                              Size: =11
                              FontWeight: =FontWeight.Semibold
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Color: =If(ThisItem.IsActive, RGBA(38, 124, 87, 1), RGBA(104, 115, 138, 1))
                              Fill: =If(ThisItem.IsActive, RGBA(226, 244, 235, 1), RGBA(238, 240, 246, 1))
                        - btnTRowEdit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Edit"
                              X: =Parent.TemplateWidth - 84
                              Y: =12
                              Width: =76
                              Height: =34
                              Size: =12
                              Appearance: =ButtonAppearance.Secondary
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varEditTpl, ThisItem);
                                Set(varTplActive, ThisItem.IsActive);
                                Set(varShowTplModal, true)
                        - recTRowDivider:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =""
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =RGBA(228, 231, 239, 1)
                  - lblTplEmpty:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="No templates found. Run the SharePoint seed script (CreateLists-Graph.ps1) to create the default templates, then reopen this screen."
                        Height: =40
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Color: =RGBA(104, 115, 138, 1)
                        Visible: =CountRows(colEmailTemplates) = 0
            # ---------------- USER ROLES PANEL ----------------
            - conRolesPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(228, 231, 239, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  Visible: =varSettingsTab = "roles"
                Children:
                  - conRolesHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Height: =40
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblRolesPanelTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="User Roles"
                              Height: =24
                              FillPortions: =1
                              Size: =13
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(23, 32, 51, 1)
                        - btnRoleAdd:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="+ Add User"
                              Width: =130
                              Height: =36
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varRoleModalMode, "new");
                                Set(varEditRole, Blank());
                                Reset(txtRoleEmail);
                                Set(varNewRoleType, "Coordinator");
                                Set(varShowRoleModal, true)
                  - lblRolesPanelSub:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Admins see everything including this settings page. Coordinators see the Admin dashboard but not settings. Everyone else is a regular user. Role changes take effect the next time the person opens the app."
                        Height: =20
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Color: =RGBA(104, 115, 138, 1)
                  # Table header
                  - conRolesTblHead:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Height: =28
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblRColName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="NAME"
                              X: =Parent.Width * 0.02
                              Y: =0
                              Width: =Parent.Width * 0.28
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblRColEmail:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="EMAIL"
                              X: =Parent.Width * 0.32
                              Y: =0
                              Width: =Parent.Width * 0.34
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblRColRole:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="ROLE"
                              X: =Parent.Width * 0.68
                              Y: =0
                              Width: =Parent.Width * 0.14
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblRColActions:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="ACTIONS"
                              X: =Parent.Width - 184
                              Y: =0
                              Width: =176
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Align: =Align.Right
                              Color: =RGBA(104, 115, 138, 1)
                  - galRoles:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        ShowScrollbar: =false
                        TemplateSize: =56
                        TemplatePadding: =0
                        Items: =Sort(colAppRoles, Lower(Coalesce(UserEmail.DisplayName, Title)))
                      Children:
                        - lblRRowName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =Coalesce(ThisItem.UserEmail.DisplayName, ThisItem.Title)
                              X: =Parent.TemplateWidth * 0.02
                              Y: =16
                              Width: =Parent.TemplateWidth * 0.28
                              Height: =24
                              AutoHeight: =true
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(23, 32, 51, 1)
                        - lblRRowEmail:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =Lower(Coalesce(ThisItem.UserEmail.Email, ""))
                              X: =Parent.TemplateWidth * 0.32
                              Y: =16
                              Width: =Parent.TemplateWidth * 0.34
                              Height: =24
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblRRowRole:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =Upper(Coalesce(ThisItem.Role.Value, ""))
                              X: =Parent.TemplateWidth * 0.68
                              Y: =14
                              Width: =Parent.TemplateWidth * 0.12
                              Height: =26
                              AutoHeight: =true
                              Size: =11
                              FontWeight: =FontWeight.Semibold
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Color: =If(ThisItem.Role.Value = "Admin", RGBA(31, 91, 189, 1), RGBA(38, 124, 87, 1))
                              Fill: =If(ThisItem.Role.Value = "Admin", RGBA(230, 238, 251, 1), RGBA(226, 244, 235, 1))
                        - btnRRowEdit:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Edit"
                              X: =Parent.TemplateWidth - 184
                              Y: =10
                              Width: =76
                              Height: =34
                              Size: =12
                              Appearance: =ButtonAppearance.Secondary
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varRoleModalMode, "edit");
                                Set(varEditRole, ThisItem);
                                Set(varNewRoleType, Coalesce(ThisItem.Role.Value, "Coordinator"));
                                Reset(txtRoleEmail);
                                Set(varShowRoleModal, true)
                        - btnRRowRemove:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Remove"
                              X: =Parent.TemplateWidth - 100
                              Y: =10
                              Width: =92
                              Height: =34
                              Size: =12
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(216, 75, 82, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =Set(varRemoveRole, ThisItem);
                                Set(varShowRoleRemove, true)
                        - recRRowDivider_Set:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =""
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =RGBA(228, 231, 239, 1)
                  - lblRolesEmpty:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="No roles configured - right now EVERYONE who opens the app is treated as an Admin. Add your own account as Admin first to lock this down."
                        Height: =40
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Wrap: =true
                        Color: =RGBA(178, 106, 22, 1)
                        Visible: =CountRows(colAppRoles) = 0
            # ---------------- PROMOTE EVENT PANEL ----------------
            - conPromotePanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =20
                  PaddingBottom: =20
                  PaddingLeft: =24
                  PaddingRight: =24
                  Fill: =RGBA(255, 255, 255, 1)
                  BorderColor: =RGBA(228, 231, 239, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  Visible: =varSettingsTab = "promote"
                Children:
                  - lblPromoPanelTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Promote an Event"
                        Height: =24
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
                  - lblPromoPanelSub:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="The promoted event is featured on the app's welcome page with View Details and Register buttons. Only one event can be promoted at a time - promoting a new one replaces the current one. Audience-restricted events are not listed because the welcome page is visible to everyone."
                        Height: =36
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Wrap: =true
                        Color: =RGBA(104, 115, 138, 1)
                  # Table header
                  - conPromoHead:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        Height: =28
                        FillPortions: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        - lblPColName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="EVENT"
                              X: =Parent.Width * 0.02
                              Y: =0
                              Width: =Parent.Width * 0.40
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblPColDates:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="DATES"
                              X: =Parent.Width * 0.44
                              Y: =0
                              Width: =Parent.Width * 0.26
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblPColStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="STATUS"
                              X: =Parent.Width * 0.71
                              Y: =0
                              Width: =Parent.Width * 0.13
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                        - lblPColAction:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="ACTION"
                              X: =Parent.Width - 130
                              Y: =0
                              Width: =122
                              Height: =28
                              AutoHeight: =true
                              Size: =12
                              Color: =RGBA(104, 115, 138, 1)
                  - galPromoEvents:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        TemplateSize: =56
                        TemplatePadding: =0
                        ShowScrollbar: =true
                        Items: =SortByColumns(Filter(colPromoEvents, IsBlank(AudienceGroupID)), "StartDate", SortOrder.Ascending)
                      Children:
                        - lblPRowName:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Title
                              X: =Parent.TemplateWidth * 0.02
                              Y: =8
                              Width: =Parent.TemplateWidth * 0.40
                              Height: =40
                              AutoHeight: =true
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(23, 32, 51, 1)
                        - lblPRowDates:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                =Text(ThisItem.StartDate, "mmm d") & " – " & Text(ThisItem.EndDate, "mmm d, yyyy")
                              X: =Parent.TemplateWidth * 0.44
                              Y: =8
                              Width: =Parent.TemplateWidth * 0.26
                              Height: =40
                              AutoHeight: =true
                              Size: =13
                              Color: =RGBA(70, 79, 96, 1)
                        - lblPRowStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =If(ThisItem.IsPromoted, "★ Promoted", "—")
                              X: =Parent.TemplateWidth * 0.71
                              Y: =8
                              Width: =Parent.TemplateWidth * 0.13
                              Height: =40
                              AutoHeight: =true
                              Size: =13
                              FontWeight: =If(ThisItem.IsPromoted, FontWeight.Bold, FontWeight.Normal)
                              Color: =If(ThisItem.IsPromoted, RGBA(178, 106, 22, 1), RGBA(160, 167, 180, 1))
                        - btnPRowPromote:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: =If(ThisItem.IsPromoted, "Remove", "Promote")
                              X: =Parent.TemplateWidth - 130
                              Y: =11
                              Width: =122
                              Height: =34
                              Size: =13
                              Appearance: =If(ThisItem.IsPromoted, ButtonAppearance.Secondary, ButtonAppearance.Primary)
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: |-
                                =If(ThisItem.IsPromoted,
                                    Patch(EventSessionRegistration_Events, LookUp(EventSessionRegistration_Events, ID = ThisItem.ID), {IsPromoted: false});
                                    Notify("Removed from the welcome page: " & ThisItem.Title, NotificationType.Success),
                                    ForAll(Filter(colPromoEvents, IsPromoted = true) As promo,
                                        Patch(EventSessionRegistration_Events, LookUp(EventSessionRegistration_Events, ID = promo.ID), {IsPromoted: false}));
                                    Patch(EventSessionRegistration_Events, LookUp(EventSessionRegistration_Events, ID = ThisItem.ID), {IsPromoted: true});
                                    Notify("Now promoted on the welcome page: " & ThisItem.Title, NotificationType.Success));
                                ClearCollect(colPromoEvents, Filter(EventSessionRegistration_Events, IsActive = true, EndDate >= Today()))
                        - recPRowLine:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =""
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =RGBA(228, 231, 239, 1)
                  - lblPromoEmpty:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="No active upcoming events to promote. Create an event on the Admin screen first."
                        Height: =40
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        Wrap: =true
                        Color: =RGBA(104, 115, 138, 1)
                        Visible: =CountRows(Filter(colPromoEvents, IsBlank(AudienceGroupID))) = 0
      # ---------------- EDIT TEMPLATE MODAL (screen level, on top) ----------------
