                  X: =24
                  Y: =86
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtTplName:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =108
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: =Coalesce(varEditTpl.Title, "")
