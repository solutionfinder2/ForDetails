                        X: =Parent.TemplateWidth - 50
                        Y: =3
                        Width: =44
                        Height: =40
                        Size: =14
                        Appearance: =ButtonAppearance.Outline
                        Color: =RGBA(216, 75, 82, 1)
                        BorderColor: |-
                          =If(varSlotRemoveID = ThisItem.ExistID,
                              RGBA(216, 75, 82, 1), RGBA(239, 183, 187, 1))
                        Tooltip: ="Remove this session permanently"
                        Visible: =ThisItem.ExistID > 0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =If(varSlotRemoveID <> ThisItem.ExistID,
                              Set(varSlotRemoveID, ThisItem.ExistID);
                              Notify("This permanently removes the " & ThisItem.Label & " session" &
                                  With({regs: CountRows(Filter(colFutureRegs, SlotID = ThisItem.ExistID))},
                                      If(regs > 0, " and strands its " & regs & " registration(s)", "")) &
                                  ". Click the bin again to confirm.", NotificationType.Warning),
                              Remove(EventSessionRegistration_SessionTimeSlots, LookUp(EventSessionRegistration_SessionTimeSlots, ID = ThisItem.ExistID));
                              ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
                              ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
                              Set(varSlotRemoveID, 0);
                              Notify("Session deleted.", NotificationType.Success))
