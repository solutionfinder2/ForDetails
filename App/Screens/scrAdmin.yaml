# =============================================================
# scrAdmin - Admin dashboard (RESPONSIVE, MODERN CONTROLS)
# Root horizontal container: fixed sidebar (245) + flexible main area.
# =============================================================
Screens:
  scrAdmin:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =If(varIsCoordinator,
            ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
            ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
            ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
            If(varIsAdmin,
                ClearCollect(colEvents, EventSessionRegistration_Events),
                ClearCollect(colEvents, Filter(EventSessionRegistration_Events, CoordinatorEmail = varUserEmail)));
            ClearCollect(colAdminRegs, Filter(EventSessionRegistration_Registrations, SessionDate >= DateAdd(Today(), -90, TimeUnit.Days)));
            If(!varIsAdmin,
                RemoveIf(colAdminSlots, !(EventID in colEvents.ID));
                RemoveIf(colAdminRegs, !(EventID in colEvents.ID)));
            Set(varAdminTab, "dashboard");
            Set(varAdminSessView, "list");
            Set(varAdminEvView, "list");
            Set(varAdminCalSel, Today());
            Set(varAdminCalMonth, Date(Year(Today()), Month(Today()), 1)))
    Children:
      - imgBackground_Admin:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_Admin:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
