                                                          "{SessionDate}", Text(ThisItem.SessionDate, "dddd, mmmm d, yyyy")),
                                                          "{TimeSlot}", ThisItem.TimeSlot),
                                                          "{MeetingLink}", link),
                                                          "{ReferenceID}", "WSR-" & Text(ThisItem.ID)),
