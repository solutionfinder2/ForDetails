                                                Y: =8
                                                Width: =Parent.TemplateWidth - 120
                                                Height: =22
                                                AutoHeight: =true
                                                Size: =13
                                                FontWeight: =FontWeight.Bold
                                                Color: =If(ThisItem.IsActive, RGBA(23, 32, 51, 1), RGBA(150, 156, 172, 1))
                                          - lblACalSlotEvent:
