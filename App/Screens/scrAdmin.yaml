                                                             left <= 4, "Almost Full",
                                                             "Open")))
                                                X: =12
                                                Y: =52
                                                Width: =100
                                                Height: =22
                                                AutoHeight: =true
                                                Size: =11
                                                FontWeight: =FontWeight.Semibold
                                                Align: =Align.Center
                                                Fill: |-
                                                  =If(!ThisItem.IsActive, RGBA(238, 240, 246, 1),
                                                      With({left: ThisItem.Capacity - ThisItem.Registered},
