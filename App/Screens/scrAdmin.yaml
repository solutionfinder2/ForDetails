                        # Admin sessions table
                        - galAdminSessions:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              TemplateSize: =56
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              Visible: =varAdminTab = "sessions" && varAdminSessView <> "calendar"
                              Items: |-
                                =Filter(
                                    AddColumns(
                                        SortByColumns(colAdminSlots, "SessionDate", SortOrder.Ascending, "SortOrder", SortOrder.Ascending),
                                        Registered, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId)))),
                                    IsBlank(cmbSessionEvent.Selected.ID) || EventID = cmbSessionEvent.Selected.ID)
                            Children:
                              - lblARowDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =Text(ThisItem.SessionDate, "ddd, mmm d, yyyy")
                                    X: =Parent.TemplateWidth * 0.02
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.12
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =If(ThisItem.IsActive, RGBA(23, 32, 51, 1), RGBA(150, 156, 172, 1))
                              - lblARowTime:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =ThisItem.Title
                                    X: =Parent.TemplateWidth * 0.15
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.13
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =If(ThisItem.IsActive, RGBA(23, 32, 51, 1), RGBA(150, 156, 172, 1))
                              - lblARowEvent:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =If(IsBlank(ThisItem.EventName), "—", ThisItem.EventName)
                                    X: =Parent.TemplateWidth * 0.29
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.13
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =If(ThisItem.IsActive, RGBA(23, 32, 51, 1), RGBA(150, 156, 172, 1))
                              - lblARowCapacity:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =Text(ThisItem.Capacity)
                                    X: =Parent.TemplateWidth * 0.43
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.07
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblARowRegistered:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =Text(ThisItem.Registered)
                                    X: =Parent.TemplateWidth * 0.51
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.08
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblARowAvailable:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =Text(ThisItem.Capacity - ThisItem.Registered)
                                    X: =Parent.TemplateWidth * 0.6
                                    Y: =14
                                    Width: =Parent.TemplateWidth * 0.07
                                    Height: =28
                                    AutoHeight: =true
                                    Size: =13
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblARowBadge:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      =If(!ThisItem.IsActive, "Inactive",
                                          With({left: ThisItem.Capacity - ThisItem.Registered},
                                              If(left = 0, "Full",
                                                 left <= 4, "Almost Full",
                                                 "Open")))
                                    X: =Parent.TemplateWidth * 0.68
                                    Y: =15
                                    Width: =100
                                    Height: =26
                                    AutoHeight: =true
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Center
                                    Fill: |-
                                      =If(!ThisItem.IsActive, RGBA(238, 240, 246, 1),
                                          With({left: ThisItem.Capacity - ThisItem.Registered},
                                              If(left = 0, RGBA(253, 236, 238, 1),
                                                 left <= 4, RGBA(255, 244, 223, 1),
                                                 RGBA(233, 248, 241, 1))))
                                    Color: |-
                                      =If(!ThisItem.IsActive, RGBA(104, 115, 138, 1),
                                          With({left: ThisItem.Capacity - ThisItem.Registered},
                                              If(left = 0, RGBA(216, 75, 82, 1),
                                                 left <= 4, RGBA(199, 122, 0, 1),
                                                 RGBA(21, 150, 106, 1))))
                                    RadiusTopLeft: =13
                                    RadiusTopRight: =13
                                    RadiusBottomLeft: =13
                                    RadiusBottomRight: =13
                              - btnARowView:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="Manage"
                                    X: =Parent.TemplateWidth - 110
                                    Y: =12
                                    Width: =90
                                    Height: =32
                                    Size: =13
                                    Appearance: =ButtonAppearance.Secondary
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    OnSelect: |-
                                      =Set(varDetailSlot, ThisItem);
                                      Set(varConfirmDelete, false);
                                      Set(varShowSessionDetail, true)
                              - recARowDivider:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =""
                                    X: =0
                                    Y: =55
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =RGBA(238, 240, 245, 1)
                        # ---------------- SESSIONS CALENDAR VIEW ----------------
                        - conAdminCal:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =16
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Visible: =varAdminTab = "sessions" && varAdminSessView = "calendar"
                            Children:
                              # LEFT: month calendar
                              - conACalLeft:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =3
                                    LayoutMinWidth: =360
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =4
                                    Fill: =RGBA(0, 0, 0, 0)
                                    DropShadow: =DropShadow.None
                                  Children:
                                    # Month navigation
                                    - conACalNav:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Height: =40
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =8
                                          Fill: =RGBA(0, 0, 0, 0)
                                          DropShadow: =DropShadow.None
                                        Children:
                                          - btnACalPrev:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Text: ="‹"
                                                Width: =40
                                                Height: =34
                                                FillPortions: =0
                                                Size: =12
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =RGBA(55, 63, 75, 1)
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                OnSelect: =Set(varAdminCalMonth, DateAdd(varAdminCalMonth, -1, TimeUnit.Months))
                                          - lblACalMonth:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =Text(varAdminCalMonth, "mmmm yyyy")
                                                Height: =34
                                                FillPortions: =1
                                                Size: =12
                                                FontWeight: =FontWeight.Bold
                                                Align: =Align.Center
                                                Color: =RGBA(23, 32, 51, 1)
                                          - btnACalToday:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Text: ="Today"
                                                Width: =72
                                                Height: =34
                                                FillPortions: =0
                                                Size: =12
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =RGBA(55, 63, 75, 1)
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                OnSelect: |-
                                                  =Set(varAdminCalSel, Today());
                                                  Set(varAdminCalMonth, Date(Year(Today()), Month(Today()), 1))
                                          - btnACalNext:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Text: ="›"
                                                Width: =40
                                                Height: =34
                                                FillPortions: =0
                                                Size: =12
                                                Appearance: =ButtonAppearance.Secondary
                                                BasePaletteColor: =RGBA(55, 63, 75, 1)
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                OnSelect: =Set(varAdminCalMonth, DateAdd(varAdminCalMonth, 1, TimeUnit.Months))
                                    # Weekday header (Sun-Sat)
                                    - galACalWeekdays:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          Height: =24
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          TemplateSize: =RoundDown(Self.Width / 7, 0)
                                          TemplatePadding: =0
                                          ShowScrollbar: =false
                                          Items: =["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
                                        Children:
                                          - lblACalWeekday:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =ThisItem.Value
                                                X: =0
                                                Y: =0
                                                Width: =Parent.TemplateWidth
                                                Height: =22
                                                AutoHeight: =true
                                                Size: =11
                                                FontWeight: =FontWeight.Semibold
                                                Align: =Align.Center
                                                Color: =RGBA(104, 115, 138, 1)
                                    # Month grid: 6 weeks x 7 days (42 cells)
                                    - galACalGrid:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          WrapCount: =7
                                          TemplateSize: =Max(34, RoundDown(Self.Height / 6, 0))
                                          TemplatePadding: =2
                                          ShowScrollbar: =false
                                          Items: |-
                                            =With({som: Date(Year(varAdminCalMonth), Month(varAdminCalMonth), 1)},
                                                With({first: DateAdd(som, 1 - Weekday(som), TimeUnit.Days)},
                                                    AddColumns(Sequence(42),
                                                        DayDate, DateAdd(first, Value - 1, TimeUnit.Days),
                                                        SlotCount, With({d: DateAdd(first, Value - 1, TimeUnit.Days)},
                                                            CountRows(Filter(colAdminSlots, SessionDate = d,
                                                                IsBlank(cmbSessionEvent.Selected.ID) || EventID = cmbSessionEvent.Selected.ID))))))
                                        Children:
                                          - recACalCell:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =""
                                                X: =1
                                                Y: =1
                                                Width: =Parent.TemplateWidth - 4
                                                Height: =Parent.TemplateHeight - 4
                                                Fill: |-
                                                  =If(ThisItem.DayDate = varAdminCalSel, RGBA(55, 63, 75, 1),
                                                      ThisItem.SlotCount > 0, RGBA(233, 248, 241, 1),
                                                      ThisItem.DayDate = Today(), RGBA(238, 240, 246, 1),
                                                      RGBA(255, 255, 255, 1))
                                                BorderColor: |-
                                                  =If(ThisItem.DayDate = varAdminCalSel, RGBA(55, 63, 75, 1),
                                                      ThisItem.DayDate = Today(), RGBA(55, 63, 75, 1),
                                                      RGBA(238, 240, 245, 1))
                                                BorderThickness: =1
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                          - lblACalDayNum:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =Text(Day(ThisItem.DayDate))
                                                X: =1
                                                Y: =4
                                                Width: =Parent.TemplateWidth - 4
                                                Height: =20
                                                AutoHeight: =true
                                                Size: =12
                                                FontWeight: =If(ThisItem.DayDate = Today() || ThisItem.DayDate = varAdminCalSel, FontWeight.Bold, FontWeight.Normal)
                                                Align: =Align.Center
                                                Color: |-
                                                  =If(ThisItem.DayDate = varAdminCalSel, RGBA(255, 255, 255, 1),
                                                      Month(ThisItem.DayDate) <> Month(varAdminCalMonth), RGBA(190, 195, 206, 1),
                                                      RGBA(23, 32, 51, 1))
                                          - lblACalDayDot:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =If(ThisItem.SlotCount > 0, Text(ThisItem.SlotCount), "")
                                                X: =(Parent.TemplateWidth - 20) / 2
                                                Y: =Parent.TemplateHeight - 26
                                                Width: =18
                                                Height: =18
                                                AutoHeight: =true
                                                Size: =10
                                                FontWeight: =FontWeight.Bold
                                                Align: =Align.Center
                                                Visible: =ThisItem.SlotCount > 0
                                                Fill: |-
                                                  =If(ThisItem.DayDate = varAdminCalSel,
                                                      RGBA(255, 255, 255, 1), RGBA(21, 150, 106, 1))
                                                Color: |-
                                                  =If(ThisItem.DayDate = varAdminCalSel,
                                                      RGBA(55, 63, 75, 1), RGBA(255, 255, 255, 1))
                                                RadiusTopLeft: =9
                                                RadiusTopRight: =9
                                                RadiusBottomLeft: =9
                                                RadiusBottomRight: =9
                                          - btnACalCell:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Text: =""
                                                X: =1
                                                Y: =1
                                                Width: =Parent.TemplateWidth - 4
                                                Height: =Parent.TemplateHeight - 4
                                                Appearance: =ButtonAppearance.Transparent
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                OnSelect: =Set(varAdminCalSel, ThisItem.DayDate)
                              # RIGHT: selected day sessions
                              - conACalRight:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =2
                                    LayoutMinWidth: =250
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =6
                                    PaddingTop: =8
                                    PaddingBottom: =8
                                    PaddingLeft: =14
                                    PaddingRight: =14
                                    Fill: =RGBA(246, 247, 251, 1)
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                  Children:
                                    - lblACalSelHead:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: ="Sessions on " & Text(varAdminCalSel, "ddd, mmm d, yyyy")
                                          Height: =26
                                          AutoHeight: =true
                                          FillPortions: =0
                                          Size: =13
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                    - lblACalNoSlots:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: ="No sessions on this day. Days with a green count badge have sessions."
                                          Height: =52
                                          AutoHeight: =true
                                          FillPortions: =0
                                          Size: =12
                                          Wrap: =true
                                          Align: =Align.Center
                                          Color: =RGBA(104, 115, 138, 1)
                                          Fill: =RGBA(255, 255, 255, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          Visible: |-
                                            =CountRows(Filter(colAdminSlots, SessionDate = varAdminCalSel,
                                                IsBlank(cmbSessionEvent.Selected.ID) || EventID = cmbSessionEvent.Selected.ID)) = 0
