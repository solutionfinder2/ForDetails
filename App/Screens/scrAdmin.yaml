      # ---------------- NEW SESSION MODAL (screen level, on top) ----------------
      - recNewSessionOverlay:
          Control: ModernText@1.0.0
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(20, 24, 42, 0.45)
            Visible: =varShowNewSession
            OnSelect: =Set(varShowNewSession, false)
      - conNewSessionModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - 600) / 2
            Y: =(Parent.Height - 700) / 2
            Width: =600
            Height: =700
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            Visible: =varShowNewSession
          Children:
            - lblNewSessionTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(varSessionModalMode = "edit", "Edit Session",
                        IsBlank(varNewSessionEvent), "New Session",
                        "New Session · " & varNewSessionEvent.Title)
                  X: =24
                  Y: =20
                  Width: =Parent.Width - 48
                  Height: =30
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(23, 32, 51, 1)
            - lblNewSessionSub:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(varSessionModalMode = "edit",
                        "Change the date, time slot, or capacity of this session.",
                        IsBlank(varNewSessionEvent),
                        "Create a time slot that participants can register for.",
                        With({ev: LookUp(colEvents, ID = varNewSessionEvent.ID)},
                            "This session will be added to " & varNewSessionEvent.Title &
                            If(IsBlank(ev.StartDate), ".",
                                " (" & Text(ev.StartDate, "mmm d") & " – " & Text(ev.EndDate, "mmm d, yyyy") & ").")))
                  X: =24
                  Y: =50
                  Width: =Parent.Width - 48
                  Height: =20
                  AutoHeight: =true
                  Size: =13
                  Color: =RGBA(104, 115, 138, 1)
            - lblNewSessionEventLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Event"
                  X: =24
                  Y: =88
                  Width: =Parent.Width - 48
                  Height: =20
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - lblNewSessionEventPill:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(IsBlank(varNewSessionEvent), "None (general session)",
                        With({ev: LookUp(colEvents, ID = varNewSessionEvent.ID)},
                            varNewSessionEvent.Title &
                            If(IsBlank(ev.StartDate), "",
                                "   ·   " & Text(ev.StartDate, "mmm d") & " – " & Text(ev.EndDate, "mmm d, yyyy"))))
                  X: =24
                  Y: =110
                  Width: =Parent.Width - 48
                  Height: =44
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Fill: =RGBA(243, 244, 248, 1)
                  Color: =RGBA(23, 32, 51, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
            - lblNewSessionDateLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Date"
                  X: =24
                  Y: =170
                  Width: =Parent.Width - 48
                  Height: =20
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - dtpNewSession:
                Control: ModernDatePicker@1.0.1
                Properties:
                  X: =24
                  Y: =192
                  Width: =Parent.Width - 48
                  Height: =44
                  DefaultDate: |-
                    =If(varSessionModalMode = "edit" && !IsBlank(varDetailSlot),
                        varDetailSlot.SessionDate,
                        !IsBlank(varNewSessionEvent),
                        With({ev: LookUp(colEvents, ID = varNewSessionEvent.ID)},
                            If(ev.StartDate > Today(), ev.StartDate, Today())),
                        Today())
                  Placeholder: ="Select a date"
            - lblNewSessionSlotLabel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Time Slot"
                  X: =24
                  Y: =252
                  Width: =140
                  Height: =20
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - lblNewSlotHint:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="✎ edit   ⏸ deactivate   ▶ reactivate   🗑 remove"
                  X: =170
                  Y: =252
                  Width: =Parent.Width - 194
                  Height: =20
                  AutoHeight: =true
                  Size: =11
                  Align: =Align.Right
                  Color: =RGBA(104, 115, 138, 1)
            - galNewSlotPick:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =24
                  Y: =274
                  Width: =Parent.Width - 48
                  Height: =230
                  TemplateSize: =46
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Items: |-
                    =With({ev: LookUp(colEvents, ID = varNewSessionEvent.ID)},
                     With({startM: IfError(Hour(TimeValue(Coalesce(ev.DayStartTime, "9:00 AM"))) * 60 + Minute(TimeValue(Coalesce(ev.DayStartTime, "9:00 AM"))), 540),
                           endM: IfError(Hour(TimeValue(Coalesce(ev.DayEndTime, "3:00 PM"))) * 60 + Minute(TimeValue(Coalesce(ev.DayEndTime, "3:00 PM"))), 900),
                           dur: If(Coalesce(ev.SlotDuration, 0) <= 0, 60, ev.SlotDuration)},
                      AddColumns(
                       If(Coalesce(ev.IsAllDay, false),
                         Table({Label: "All Day", Sort: 0, Mins: 1440}),
                         ForAll(Sequence(Max(RoundDown((endM - startM) / dur, 0), 0)) As n,
                            {Label: Text(DateAdd(Date(2000, 1, 1), startM + (n.Value - 1) * dur, TimeUnit.Minutes), "h:mm AM/PM") & " – " &
                                    Text(DateAdd(Date(2000, 1, 1), startM + n.Value * dur, TimeUnit.Minutes), "h:mm AM/PM"),
                             Sort: startM + (n.Value - 1) * dur,
                             Mins: dur})),
                       ExistID, With({s: Sort},
                           Coalesce(LookUp(colAdminSlots,
                               EventID = varNewSessionEvent.ID && SessionDate = dtpNewSession.SelectedDate && SortOrder = s, ID), 0)),
                       ExistActive, With({s: Sort},
                           Coalesce(LookUp(colAdminSlots,
                               EventID = varNewSessionEvent.ID && SessionDate = dtpNewSession.SelectedDate && SortOrder = s, IsActive), false)))))
                Children:
                  - btnPickSlot:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: |-
                          =ThisItem.Label &
                          If(ThisItem.ExistID > 0,
                              If(ThisItem.ExistActive, "   ·   ✓ Created", "   ·   ⏸ Inactive"), "")
                        X: =0
                        Y: =3
                        Width: =Parent.TemplateWidth - If(ThisItem.ExistID > 0, 152, 0)
                        Height: =40
                        Size: =14
                        Align: =Align.Left
                        Appearance: |-
                          =If(!IsBlank(varNewSlotPick) && varNewSlotPick.Sort = ThisItem.Sort,
                              ButtonAppearance.Primary,
                              ButtonAppearance.Secondary)
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =Set(varNewSlotPick, {Label: ThisItem.Label, Sort: ThisItem.Sort, Mins: ThisItem.Mins})
                  - btnSlotRowEdit:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="✎"
                        X: =Parent.TemplateWidth - 146
                        Y: =3
                        Width: =44
                        Height: =40
                        Size: =14
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        Tooltip: ="Edit this session"
                        Visible: =ThisItem.ExistID > 0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =Set(varSessionModalMode, "edit");
                          Set(varSlotRemoveID, 0);
                          Set(varDetailSlot, LookUp(colAdminSlots, ID = ThisItem.ExistID));
                          Set(varNewSlotPick, {Label: ThisItem.Label, Sort: ThisItem.Sort, Mins: ThisItem.Mins});
                          Set(varNewCapacity, Coalesce(LookUp(colAdminSlots, ID = ThisItem.ExistID, Capacity), 20));
                          Notify("Now editing the " & ThisItem.Label & " session. Adjust the date, slot, or capacity, then click Save Changes.", NotificationType.Information)
                  - btnSlotRowToggle:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: =If(ThisItem.ExistActive, "⏸", "▶")
                        X: =Parent.TemplateWidth - 98
                        Y: =3
                        Width: =44
                        Height: =40
                        Size: =14
                        Appearance: =ButtonAppearance.Outline
                        Color: =If(ThisItem.ExistActive, RGBA(199, 122, 0, 1), RGBA(21, 150, 106, 1))
                        BorderColor: =If(ThisItem.ExistActive, RGBA(240, 210, 160, 1), RGBA(178, 226, 205, 1))
                        Tooltip: =If(ThisItem.ExistActive, "Deactivate this session", "Reactivate this session")
                        Visible: =ThisItem.ExistID > 0
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =Patch(EventSessionRegistration_SessionTimeSlots,
                              LookUp(EventSessionRegistration_SessionTimeSlots, ID = ThisItem.ExistID),
                              {IsActive: !ThisItem.ExistActive});
                          ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
                          ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
                          Notify(If(ThisItem.ExistActive,
                              "Session deactivated. It is hidden from registration; existing registrations are kept.",
                              "Session reactivated. It is open for registration again."), NotificationType.Success)
                  - btnSlotRowRemove:
                      Control: ModernButton@1.0.0
                      Properties:
