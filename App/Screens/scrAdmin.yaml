                                                        IsBlank(cmbSessionEvent.Selected.ID) || EventID = cmbSessionEvent.Selected.ID),
                                                    "SortOrder", SortOrder.Ascending),
                                                Registered, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId))))
                                        Children:
                                          - recACalSlotCard:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Text: =""
                                                X: =0
                                                Y: =0
                                                Width: =Parent.TemplateWidth
                                                Height: =78
                                                Fill: =RGBA(255, 255, 255, 1)
                                                BorderColor: =RGBA(228, 231, 239, 1)
                                                BorderThickness: =1
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                          - lblACalSlotTime:
                                              Control: ModernText@1.0.0
                                              Properties:
