                                  Properties:
                                    Text: ="⤓ Download CSV"
                                    Width: =150
                                    Height: =36
                                    FillPortions: =0
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Appearance: =ButtonAppearance.Secondary
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    Visible: =varAdminTab = "reports"
                                    OnSelect: |-
                                      =If(CountRows(galRptByEvent.AllItems) = 0,
                                          Notify("Nothing to export with the current filters.", NotificationType.Warning),
                                          With({res: EventSessionRegistration_ExportCSV.Run(
                                                  "Report_ByEvent_" & Text(Now(), "yyyymmdd-hhmmss") & ".csv",
                                                  "Event,Registrations,Confirmed,Cancelled" & Char(10) &
                                                  Concat(galRptByEvent.AllItems,
                                                      Substitute(Title, ",", " ") & "," &
                                                      RegCount & "," & ConfCount & "," & CancCount,
                                                      Char(10)))},
                                              If(IsBlank(res.fileurl),
                                                  Notify("Export failed - check the EventSessionRegistration_ExportCSV flow run history.", NotificationType.Error),
                                                  Download(res.fileurl & "?download=1"))))
                              - btnSendRpt:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="✉ Send Report"
                                    Width: =140
                                    Height: =36
                                    FillPortions: =0
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Appearance: =ButtonAppearance.Secondary
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    Visible: =varAdminTab = "reports"
                                    OnSelect: |-
                                      =If(CountRows(galRptByEvent.AllItems) = 0,
                                          Notify("Nothing to send with the current filters.", NotificationType.Warning),
                                          Set(varSendRptFile, "Report_ByEvent_" & Text(Now(), "yyyymmdd-hhmmss") & ".csv");
                                          Set(varSendRptCSV,
                                              "Event,Registrations,Confirmed,Cancelled" & Char(10) &
                                              Concat(galRptByEvent.AllItems,
                                                  Substitute(Title, ",", " ") & "," &
                                                  RegCount & "," & ConfCount & "," & CancCount,
                                                  Char(10)));
                                          Set(varSendRptRows, CountRows(galRptByEvent.AllItems));
                                          Clear(colSendRptTo);
                                          Reset(txtSendRptSearch);
                                          Set(varShowSendRpt, true))
