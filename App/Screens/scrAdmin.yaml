      # ---------------- SEND REPORT MODAL (screen level, on top) ----------------
      - recSendRptOverlay:
          Control: ModernText@1.0.0
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(20, 24, 42, 0.45)
            Visible: =varShowSendRpt
            OnSelect: =Set(varShowSendRpt, false)
      - conSendRptModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - 560) / 2
            Y: =Max(12, (Parent.Height - 560) / 2)
            Width: =560
            Height: =560
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            Visible: =varShowSendRpt
          Children:
            - lblSendRptTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Send Report"
                  X: =24
                  Y: =20
                  Width: =Parent.Width - 48
                  Height: =30
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(23, 32, 51, 1)
            - lblSendRptFile:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    ="Attachment: " & Coalesce(varSendRptFile, "") & "  (" & Coalesce(varSendRptRows, 0) & " rows)"
                  X: =24
                  Y: =52
                  Width: =Parent.Width - 48
                  Height: =22
                  AutoHeight: =true
                  Size: =13
                  Color: =RGBA(104, 115, 138, 1)
            - lblSendRptTo:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Recipients"
                  X: =24
                  Y: =94
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtSendRptSearch:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =116
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: =""
                  Placeholder: ="Type a name or email to search…"
                  Type: =TextInputType.SingleLine
            - galSendRptSel:
                Control: Gallery
                Variant: Horizontal
                Properties:
                  X: =24
                  Y: =158
                  Width: =Parent.Width - 48
                  Height: =34
                  TemplateSize: =190
                  TemplatePadding: =0
                  ShowScrollbar: =false
                  Visible: =CountRows(colSendRptTo) > 0
                  Items: =colSendRptTo
                Children:
                  - btnSendRptChip:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: =ThisItem.DisplayName & "  ✕"
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth - 8
                        Height: =32
                        Size: =12
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        OnSelect: =Remove(colSendRptTo, ThisItem)
            - lblSendRptToHint:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Results appear as you type - click a person to add them; click a chip to remove."
                  X: =24
                  Y: =196
                  Width: =Parent.Width - 48
                  Height: =16
                  AutoHeight: =true
                  Size: =11
                  Color: =RGBA(104, 115, 138, 1)
            - lblSendRptSubject:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Subject"
                  X: =24
                  Y: =224
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtSendRptSubject:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =246
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: |-
                    ="Report: " & Coalesce(varSendRptFile, "")
                  Type: =TextInputType.SingleLine
            - lblSendRptBody:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Message"
                  X: =24
                  Y: =298
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtSendRptBody:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =320
                  Width: =Parent.Width - 48
                  Height: =140
                  Size: =13
                  Default: ="Hi," & Char(10) & Char(10) & "Please find the attached report from the Event Session Registration app." & Char(10) & Char(10) & "Sent by " & varUserName
                  Type: =TextInputType.Multiline
            - btnSendRptCancel:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel"
                  X: =Parent.Width - 336
                  Y: =Parent.Height - 64
                  Width: =140
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowSendRpt, false)
            - btnSendRptSend:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Send"
                  X: =Parent.Width - 184
                  Y: =Parent.Height - 64
                  Width: =160
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =RGBA(55, 63, 75, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(CountRows(colSendRptTo) = 0,
                        Notify("Pick at least one recipient.", NotificationType.Warning),
                        If(IsError(EventSessionRegistration_SendReportEmail.Run(
                                Concat(colSendRptTo, Mail, ";"),
                                Trim(txtSendRptSubject.Text),
                                txtSendRptBody.Text,
                                varSendRptFile,
                                varSendRptCSV)),
                            Notify("Could not send the report. Check that the EventSessionRegistration_SendReportEmail flow is connected and turned on.", NotificationType.Error),
                            Set(varShowSendRpt, false);
                            Notify("Report sent to " & Concat(colSendRptTo, DisplayName, ", "), NotificationType.Success)))
            # Suggestion dropdown - declared last so it renders on top of the fields below it
            - galSendRptSug:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =24
                  Y: =152
                  Width: =Parent.Width - 48
                  Height: =176
                  TemplateSize: =44
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =!IsBlank(Trim(txtSendRptSearch.Text))
                  Items: |-
                    =Office365Users.SearchUser({searchTerm: Trim(txtSendRptSearch.Text), top: 8})
                  OnSelect: |-
                    =If(IsBlank(LookUp(colSendRptTo, Lower(Mail) = Lower(ThisItem.Mail))),
                        Collect(colSendRptTo, {DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail}));
                    Reset(txtSendRptSearch)
                Children:
                  - recSendRptSugBg:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =""
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderColor: =RGBA(228, 231, 239, 1)
                        BorderThickness: =1
                        OnSelect: =Select(Parent)
                  - lblSendRptSugName:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =ThisItem.DisplayName
                        X: =12
                        Y: =4
                        Width: =Parent.TemplateWidth - 24
                        Height: =18
                        AutoHeight: =true
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(23, 32, 51, 1)
                        OnSelect: =Select(Parent)
                  - lblSendRptSugMail:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =Lower(Coalesce(ThisItem.Mail, ""))
                        X: =12
                        Y: =22
                        Width: =Parent.TemplateWidth - 24
                        Height: =16
                        AutoHeight: =true
                        Size: =11
                        Color: =RGBA(104, 115, 138, 1)
                        OnSelect: =Select(Parent)
