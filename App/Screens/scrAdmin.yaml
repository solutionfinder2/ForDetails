            - btnEventSave:
                Control: ModernButton@1.0.0
                Properties:
                  Text: =If(varEventModalMode = "edit", "Save Changes", "Create Event")
                  X: =Parent.Width - 184
                  Y: =Parent.Height - 64
                  Width: =160
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =RGBA(55, 63, 75, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(IsBlank(Trim(txtEventName.Text)),
                        Notify("Enter an event name first (Details tab).", NotificationType.Warning),
                        IsBlank(dtpEventStart.SelectedDate) || IsBlank(dtpEventEnd.SelectedDate),
                        Notify("Pick a start and end date (Details tab).", NotificationType.Warning),
                        dtpEventEnd.SelectedDate < dtpEventStart.SelectedDate,
                        Notify("The end date can't be before the start date.", NotificationType.Warning),
                        !varEventVirtual && !varEventInPerson,
                        Notify("Check the event type: Virtual, In-Person, or both (Details tab).", NotificationType.Warning),
                        !varEventAllDay && (IsError(TimeValue(Trim(txtEventDayStart.Text))) || IsError(TimeValue(Trim(txtEventDayEnd.Text)))),
                        Notify("Enter day start/end times like 9:00 AM and 3:00 PM (Settings tab).", NotificationType.Warning),
                        !varEventAllDay && TimeValue(Trim(txtEventDayEnd.Text)) <= TimeValue(Trim(txtEventDayStart.Text)),
                        Notify("The day end time must be after the day start time (Settings tab).", NotificationType.Warning),
                        varEventAudEnabled && IsBlank(varEventAudience),
                        Notify("Pick a group for the restricted audience, or turn 'Restrict to group' off (Settings tab).", NotificationType.Warning),
                        varEventModalMode = "edit",
                        Patch(EventSessionRegistration_Events, LookUp(EventSessionRegistration_Events, ID = varEditEvent.ID),
                            {Title: Trim(txtEventName.Text),
                             Description: rteEventDesc.HtmlText,
                             StartDate: dtpEventStart.SelectedDate,
                             EndDate: dtpEventEnd.SelectedDate,
                             Location: txtEventLocation.Text,
                             Department: Trim(txtEventDept.Text),
                             EventType: If(varEventVirtual && varEventInPerson, "Both", varEventVirtual, "Virtual", "In-Person"),
                             IsAllDay: varEventAllDay,
                             SlotDuration: varEventDuration,
                             DayStartTime: Trim(txtEventDayStart.Text),
                             DayEndTime: Trim(txtEventDayEnd.Text),
                             Coordinator: If(!varIsAdmin && IsBlank(Trim(txtEventCoord.Text)), varUserName, Trim(txtEventCoord.Text)),
                             CoordinatorEmail: If(!varIsAdmin && IsBlank(Trim(txtEventCoordEmail.Text)), varUserEmail, Trim(txtEventCoordEmail.Text)),
                             POC: Trim(txtEventPOC.Text),
                             POCEmail: Trim(txtEventPOCEmail.Text),
                             RegistrationCutoffHours: Coalesce(IfError(Value(Trim(txtEventCutoff.Text)), 48), 48),
                             MaxPerUser: If(varEventOnePer, 1, Coalesce(IfError(Value(Trim(txtEventMaxPer.Text)), 0), 0)),
                             DefaultCapacity: Coalesce(IfError(Value(Trim(txtEventDefCap.Text)), 20), 20),
                             MeetingLink: Trim(txtEventLink.Text),
                             AudienceGroupID: If(varEventAudEnabled, Coalesce(varEventAudience.id, ""), ""),
                             AudienceGroupName: If(varEventAudEnabled, Coalesce(varEventAudience.displayName, ""), "")});
                        ClearCollect(colEventSessions, Filter(EventSessionRegistration_SessionTimeSlots, EventID = varEditEvent.ID));
                        ForAll(colEventSessions As sess,
                            Patch(EventSessionRegistration_SessionTimeSlots, LookUp(EventSessionRegistration_SessionTimeSlots, ID = sess.ID), {EventName: Trim(txtEventName.Text)}));
                        If(varIsAdmin,
                            ClearCollect(colEvents, EventSessionRegistration_Events),
                            ClearCollect(colEvents, Filter(EventSessionRegistration_Events, CoordinatorEmail = varUserEmail)));
                        ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
                        Set(varShowEventModal, false);
                        Notify("Event updated: " & Trim(txtEventName.Text), NotificationType.Success),
                        Patch(EventSessionRegistration_Events, Defaults(EventSessionRegistration_Events),
                            {Title: Trim(txtEventName.Text),
                             Description: rteEventDesc.HtmlText,
                             StartDate: dtpEventStart.SelectedDate,
                             EndDate: dtpEventEnd.SelectedDate,
                             Location: txtEventLocation.Text,
                             Department: Trim(txtEventDept.Text),
                             EventType: If(varEventVirtual && varEventInPerson, "Both", varEventVirtual, "Virtual", "In-Person"),
                             IsAllDay: varEventAllDay,
                             SlotDuration: varEventDuration,
                             DayStartTime: Trim(txtEventDayStart.Text),
                             DayEndTime: Trim(txtEventDayEnd.Text),
                             Coordinator: If(!varIsAdmin && IsBlank(Trim(txtEventCoord.Text)), varUserName, Trim(txtEventCoord.Text)),
                             CoordinatorEmail: If(!varIsAdmin && IsBlank(Trim(txtEventCoordEmail.Text)), varUserEmail, Trim(txtEventCoordEmail.Text)),
                             POC: Trim(txtEventPOC.Text),
                             POCEmail: Trim(txtEventPOCEmail.Text),
                             RegistrationCutoffHours: Coalesce(IfError(Value(Trim(txtEventCutoff.Text)), 48), 48),
                             MaxPerUser: If(varEventOnePer, 1, Coalesce(IfError(Value(Trim(txtEventMaxPer.Text)), 0), 0)),
                             DefaultCapacity: Coalesce(IfError(Value(Trim(txtEventDefCap.Text)), 20), 20),
                             MeetingLink: Trim(txtEventLink.Text),
                             AudienceGroupID: If(varEventAudEnabled, Coalesce(varEventAudience.id, ""), ""),
                             AudienceGroupName: If(varEventAudEnabled, Coalesce(varEventAudience.displayName, ""), ""),
                             IsActive: true});
                        If(varIsAdmin,
                            ClearCollect(colEvents, EventSessionRegistration_Events),
                            ClearCollect(colEvents, Filter(EventSessionRegistration_Events, CoordinatorEmail = varUserEmail)));
                        Set(varShowEventModal, false);
                        Notify("Event created: " & Trim(txtEventName.Text) & ". Use its + New Session action to add sessions.", NotificationType.Success))
            # Audience suggestions - drops UP above the search box; declared last for z-order
            - galEventAudSug:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =196
                  Y: =392
                  Width: =Parent.Width - 220
                  Height: =176
                  TemplateSize: =44
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =varEventModalTab = "settings" && varEventAudEnabled && IsBlank(varEventAudience) && !IsBlank(Trim(txtEventAudSearch.Text))
                  Items: |-
                    =If(IsBlank(Trim(txtEventAudSearch.Text)), Blank(),
                        FirstN(
                            Office365Groups.ListGroups({'$filter': "startswith(displayName,'" & Substitute(Trim(txtEventAudSearch.Text), "'", "''") & "')"}).value,
                            10))
                  OnSelect: |-
                    =Set(varEventAudience, {id: ThisItem.id, displayName: ThisItem.displayName});
                    Reset(txtEventAudSearch)
                Children:
                  - recEventAudSugBg:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =""
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
