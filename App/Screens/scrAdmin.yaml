                                                Y: =30
                                                Width: =Parent.TemplateWidth - 130
                                                Height: =20
                                                AutoHeight: =true
                                                Size: =11
                                                Color: =RGBA(104, 115, 138, 1)
                                          - lblACalSlotBadge:
