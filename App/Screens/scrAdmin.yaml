                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =ClearCollect(colDupeCheck,
                        Filter(EventSessionRegistration_SessionTimeSlots,
                            SessionDate = dtpNewSession.SelectedDate,
                            SortOrder = varNewSlotPick.Sort,
                            IsActive = true));
                    With({ev: LookUp(colEvents, ID = varNewSessionEvent.ID)},
                    If(IsBlank(dtpNewSession.SelectedDate),
                        Notify("Pick a date first.", NotificationType.Warning),
                        dtpNewSession.SelectedDate < Today(),
                        Notify("The date can't be in the past.", NotificationType.Warning),
                        IsBlank(varNewSlotPick),
                        Notify("Pick a time slot first.", NotificationType.Warning),
                        !IsBlank(varNewSessionEvent) &&
                            (dtpNewSession.SelectedDate < ev.StartDate || dtpNewSession.SelectedDate > ev.EndDate),
                        Notify("This event runs " & Text(ev.StartDate, "mmm d") & " – " & Text(ev.EndDate, "mmm d, yyyy") &
                            ". Pick a session date within that range.", NotificationType.Warning),
                        varSessionModalMode = "edit",
                        Patch(EventSessionRegistration_SessionTimeSlots, LookUp(EventSessionRegistration_SessionTimeSlots, ID = varDetailSlot.ID),
                            {Title: varNewSlotPick.Label,
                             SessionDate: dtpNewSession.SelectedDate,
                             SortOrder: varNewSlotPick.Sort,
                             DurationMinutes: varNewSlotPick.Mins,
                             Capacity: varNewCapacity,
                             EventID: varNewSessionEvent.ID,
                             EventName: varNewSessionEvent.Title});
                        ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
                        ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
                        Set(varShowNewSession, false);
                        Notify("Session updated: " & varNewSlotPick.Label & " on " & Text(dtpNewSession.SelectedDate, "ddd, mmm d"), NotificationType.Success),
                        CountRows(Filter(colDupeCheck, EventID = varNewSessionEvent.ID)) > 0,
                        Notify("This event already has an active session for that date and time.", NotificationType.Warning),
                        Set(varNewSession, Patch(EventSessionRegistration_SessionTimeSlots, Defaults(EventSessionRegistration_SessionTimeSlots),
                            {Title: varNewSlotPick.Label,
                             SessionDate: dtpNewSession.SelectedDate,
                             SortOrder: varNewSlotPick.Sort,
                             DurationMinutes: varNewSlotPick.Mins,
                             Capacity: varNewCapacity,
                             EventID: varNewSessionEvent.ID,
                             EventName: varNewSessionEvent.Title,
                             IsActive: true}));
                        ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
                        ClearCollect(colAdminSlots, Filter(EventSessionRegistration_SessionTimeSlots, SessionDate >= Today()));
                        Set(varShowNewSession, false);
                        Notify("Session created: " & varNewSession.Title & " on " & Text(varNewSession.SessionDate, "ddd, mmm d"), NotificationType.Success)))
