                                    Y: =12
                                    Width: =110
                                    Height: =32
                                    Size: =13
                                    Appearance: =If(ThisItem.Mine > 0, ButtonAppearance.Secondary, ButtonAppearance.Primary)
                                    BasePaletteColor: =RGBA(55, 63, 75, 1)
                                    DisplayMode: |-
                                      =If(ThisItem.Mine > 0,
                                          If(ThisItem.SlotStart < Now(), DisplayMode.Disabled, DisplayMode.Edit),
                                          ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours) ||
                                          ThisItem.Registered >= ThisItem.Capacity,
                                          DisplayMode.Disabled, DisplayMode.Edit)
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    OnSelect: |-
                                      =If(ThisItem.Mine > 0,
                                          With({r: LookUp(colFutureRegs, SlotID = ThisItem.ID && UserEmail = Lower(User().Email))},
                                              Set(varSwitchRegID, r.ID);
                                              Set(varSwitchRegLabel, Text(r.SessionDate, "ddd, mmm d") & " · " & r.TimeSlot)),
                                          Set(varSwitchRegID, 0));
                                      Set(varSelectedSlot, Blank());
                                      Set(varDeepLink, true);
                                      Set(varSelectedEvent,
                                          With({e: LookUp(EventSessionRegistration_Events, ID = ThisItem.EventID)},
                                              {ID: e.ID, Title: e.Title, Description: e.Description,
                                               StartDate: e.StartDate, EndDate: e.EndDate, Location: e.Location,
                                               EventType: e.EventType, CutoffHours: Coalesce(e.RegistrationCutoffHours, 48),
                                               MaxPerUser: Coalesce(e.MaxPerUser, 0), MeetingLink: e.MeetingLink,
                                               Coordinator: e.Coordinator, POC: e.POC, POCEmail: e.POCEmail}));
                                      Set(varDetailEvent, varSelectedEvent);
                                      Set(varCalDate, ThisItem.SessionDate);
                                      Navigate(scrRegister, ScreenTransition.Fade)
                              - recRowDivider_Home:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =""
                                    X: =0
                                    Y: =55
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =RGBA(238, 240, 245, 1)
                        # Calendar view: one column per day, slots as color-coded chips
                        - galCalDays_Home:
                            Control: Gallery
                            Variant: Horizontal
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              TemplateSize: |-
                                =Max(160, (Self.Width - 8) / Max(1, CountRows(Distinct(
                                    Filter(colWeekSlots, IsBlank(varHomeEventID) || EventID = varHomeEventID),
                                    SessionDate))))
                              TemplatePadding: =4
                              ShowScrollbar: =false
                              Visible: =varHomeView = "calendar"
                              Items: |-
                                =SortByColumns(Distinct(
                                    Filter(colWeekSlots, IsBlank(varHomeEventID) || EventID = varHomeEventID),
                                    SessionDate), "Value", SortOrder.Ascending)
                            Children:
                              - lblCalDayHead_Home:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =Text(ThisItem.Value, "ddd, mmm d")
                                    X: =2
                                    Y: =0
                                    Width: =Parent.TemplateWidth - 8
                                    Height: =34
                                    AutoHeight: =true
                                    Size: =13
                                    FontWeight: =FontWeight.Bold
                                    Align: =Align.Center
                                    Color: =RGBA(23, 32, 51, 1)
                                    Fill: =RGBA(238, 240, 246, 1)
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                              - galCalSlots_Home:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    X: =2
                                    Y: =40
                                    Width: =Parent.TemplateWidth - 8
                                    Height: =Parent.TemplateHeight - 44
                                    TemplateSize: =64
                                    TemplatePadding: =3
                                    ShowScrollbar: =false
                                    Items: |-
                                      =AddColumns(
                                          SortByColumns(
                                              Filter(colWeekSlots, SessionDate = ThisItem.Value,
                                                  IsBlank(varHomeEventID) || EventID = varHomeEventID),
                                              "SortOrder", SortOrder.Ascending),
                                        Registered, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId))),
                                        Mine, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId, UserEmail = Lower(User().Email)))),
                                        SlotStart, If(IsBlank(ThisRecord.DurationMinutes),
                                            DateAdd(ThisRecord.SessionDate, Switch(ThisRecord.SortOrder, 1, 9, 2, 10, 3, 11, 4, 13, 5, 14, 9), TimeUnit.Hours),
                                            DateAdd(ThisRecord.SessionDate, ThisRecord.SortOrder, TimeUnit.Minutes)),
                                        CutoffH, With({eid: EventID}, Coalesce(LookUp(EventSessionRegistration_Events, ID = eid, RegistrationCutoffHours), 48)))
                                  Children:
                                    - recCalSlot_Home:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: |-
                                            =ThisItem.Title & Char(10) &
                                            If(ThisItem.Mine > 0, "✓ Registered · tap to switch",
                                               ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours), "Closed",
                                               ThisItem.Registered >= ThisItem.Capacity, "Full",
                                               ThisItem.Registered & "/" & ThisItem.Capacity & " registered")
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =58
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          Wrap: =true
                                          Fill: |-
                                            =If(ThisItem.Mine > 0, RGBA(55, 63, 75, 1),
                                                ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours), RGBA(238, 240, 246, 1),
                                                With({left: ThisItem.Capacity - ThisItem.Registered},
                                                    If(left = 0, RGBA(253, 236, 238, 1),
                                                       left <= 4, RGBA(255, 244, 223, 1),
                                                       RGBA(233, 248, 241, 1))))
                                          Color: |-
                                            =If(ThisItem.Mine > 0, RGBA(255, 255, 255, 1),
                                                ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours), RGBA(104, 115, 138, 1),
                                                With({left: ThisItem.Capacity - ThisItem.Registered},
                                                    If(left = 0, RGBA(216, 75, 82, 1),
                                                       left <= 4, RGBA(199, 122, 0, 1),
                                                       RGBA(21, 150, 106, 1))))
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                    - btnCalSlot_Home:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: =""
                                          X: =0
                                          Y: =0
                                          Width: =Parent.TemplateWidth
                                          Height: =58
                                          Appearance: =ButtonAppearance.Transparent
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =If(ThisItem.Mine > 0 && ThisItem.SlotStart < Now(),
                                                Notify("This session has already started.", NotificationType.Information),
                                            ThisItem.Mine = 0 && ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours),
                                                Notify("Registration closes " & ThisItem.CutoffH & " hours before the session starts.", NotificationType.Warning),
                                            ThisItem.Mine = 0 && ThisItem.Capacity - ThisItem.Registered <= 0,
                                                Notify("This session is full.", NotificationType.Warning),
                                            If(ThisItem.Mine > 0,
                                                With({r: LookUp(colFutureRegs, SlotID = ThisItem.ID && UserEmail = Lower(User().Email))},
                                                    Set(varSwitchRegID, r.ID);
                                                    Set(varSwitchRegLabel, Text(r.SessionDate, "ddd, mmm d") & " · " & r.TimeSlot)),
                                                Set(varSwitchRegID, 0));
                                            Set(varSelectedSlot, Blank());
                                            Set(varDeepLink, true);
                                            Set(varSelectedEvent,
                                                With({e: LookUp(EventSessionRegistration_Events, ID = ThisItem.EventID)},
                                                    {ID: e.ID, Title: e.Title, Description: e.Description,
                                                     StartDate: e.StartDate, EndDate: e.EndDate, Location: e.Location,
                                                     EventType: e.EventType, CutoffHours: Coalesce(e.RegistrationCutoffHours, 48),
                                                     MaxPerUser: Coalesce(e.MaxPerUser, 0), MeetingLink: e.MeetingLink,
                                                     Coordinator: e.Coordinator, POC: e.POC, POCEmail: e.POCEmail}));
                                            Set(varDetailEvent, varSelectedEvent);
                                            Set(varCalDate, ThisItem.SessionDate);
                                            Navigate(scrRegister, ScreenTransition.Fade))
