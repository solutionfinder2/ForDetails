                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =6
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =12
                  PaddingRight: =12
                  Fill: =RGBA(33, 37, 45, 1)
                  Visible: =varSidebarOpen
