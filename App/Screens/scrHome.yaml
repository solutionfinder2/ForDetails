# =============================================================
# scrHome - Dashboard / Landing screen (RESPONSIVE, MODERN CONTROLS)
# Root horizontal container: fixed sidebar (245) + flexible main area.
# UI/UX ONLY - inline sample data. Turn OFF "Scale to fit" in app settings.
# =============================================================
Screens:
  scrHome:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =ClearCollect(colWeekSlots, Filter(EventSessionRegistration_SessionTimeSlots, IsActive = true, SessionDate >= Today(), SessionDate < DateAdd(Today(), 7, TimeUnit.Days)));
        ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
        ClearCollect(colUpcomingEvents, Filter(EventSessionRegistration_Events, IsActive = true, EndDate >= Today()));
        ClearCollect(colRestrictedEv_Home, Filter(colUpcomingEvents, !IsBlank(AudienceGroupID)));
        ForAll(colRestrictedEv_Home,
            With({gid: AudienceGroupID, evid: ID},
                With({member: IfError(
                        LookUp(Office365Groups.ListGroupMembers(gid).value,
                            Lower(Coalesce(mail, userPrincipalName)) = Lower(User().Email)),
                        Blank())},
                    If(IsBlank(member),
                        Remove(colUpcomingEvents, LookUp(colUpcomingEvents, ID = evid))))))
    Children:
      - imgBackground_Home:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_Home:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- SIDEBAR ----------------
            - conSidebar_Home:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Width: =245
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
