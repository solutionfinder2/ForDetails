# =============================================================
# scrEventDetails - Full event detail page (RESPONSIVE, MODERN CONTROLS)
# Drill-in page (no sidebar) reached from Home event cards, the
# Register wizard, My Registrations, and the confirmation modal.
# Navigate here with:
#   Set(varDetailEventID, <event ID>); Navigate(scrEventDetails, ScreenTransition.Fade)
# The Back button returns to whichever screen the user came from.
# =============================================================
Screens:
  scrEventDetails:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =Set(varEventDetail, LookUp(EventSessionRegistration_Events, ID = varDetailEventID));
        ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
        ClearCollect(colEventDetailSlots, Filter(EventSessionRegistration_SessionTimeSlots, EventID = varDetailEventID, IsActive = true, SessionDate >= Today()));
        ClearCollect(colMyEvRegs_EvD, SortByColumns(Filter(EventSessionRegistration_Registrations, EventID = varDetailEventID, UserEmail = Lower(User().Email), Status = "Confirmed"), "SessionDate", SortOrder.Ascending));
        Set(varEvDetSelSlot, Blank());
        Set(varEvDetView, "calendar");
        Set(varEvDetCalSel, Coalesce(First(SortByColumns(colEventDetailSlots, "SessionDate", SortOrder.Ascending)).SessionDate, Today()));
        Set(varEvDetCalMonth, Date(Year(varEvDetCalSel), Month(varEvDetCalSel), 1))
    Children:
      - imgBackground_EvD:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_EvD:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =28
            PaddingRight: =28
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- HEADER: back + title ----------------
            - conHeader_EvD:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =44
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =14
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  - btnBack_EvD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="← Back"
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: |-
                          =If(varDeepEvent,
                              Set(varDeepEvent, false); Navigate(scrHome, ScreenTransition.Fade),
                              Back(ScreenTransition.Fade))
                  - lblHeader_EvD:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Event Details"
                        Height: =40
                        FillPortions: =1
                        Size: =18
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
                  - btnShare_EvD:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="↗ Share"
                        Width: =110
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        Visible: =!IsBlank(varEventDetail)
                        OnSelect: =Clear(colShareEvTo); Reset(txtShareEvSearch); Set(varShowShareEv, true)
                  - lblStatusChip_EvD:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: |-
                          =If(IsBlank(varEventDetail), "",
                              varEventDetail.StartDate > Today(), "Upcoming",
                              varEventDetail.EndDate >= Today(), "In Progress",
                              "Ended")
                        Width: =120
                        Height: =30
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        Fill: |-
                          =If(IsBlank(varEventDetail), RGBA(0, 0, 0, 0),
                              varEventDetail.StartDate > Today(), RGBA(233, 248, 241, 1),
                              varEventDetail.EndDate >= Today(), RGBA(255, 244, 223, 1),
                              RGBA(238, 240, 246, 1))
                        Color: |-
                          =If(IsBlank(varEventDetail), RGBA(0, 0, 0, 0),
                              varEventDetail.StartDate > Today(), RGBA(21, 150, 106, 1),
                              varEventDetail.EndDate >= Today(), RGBA(199, 122, 0, 1),
                              RGBA(104, 115, 138, 1))
                        RadiusTopLeft: =15
                        RadiusTopRight: =15
                        RadiusBottomLeft: =15
                        RadiusBottomRight: =15
            # ---------------- BODY: two columns ----------------
            - conBody_EvD:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  LayoutWrap: =true
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  # LEFT column: hero + sessions
                  - conLeftCol_EvD:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =2
                        LayoutMinWidth: =420
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =14
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        # Hero card
                        - conHero_EvD:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =304
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =6
                              PaddingTop: =20
                              PaddingBottom: =16
                              PaddingLeft: =22
                              PaddingRight: =22
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - lblEvName_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =If(IsBlank(varEventDetail), "Event not found", varEventDetail.Title)
                                    Height: =32
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =18
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblEvMeta_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      =If(IsBlank(varEventDetail), "",
                                          Text(varEventDetail.StartDate, "ddd, mmm d") & " – " & Text(varEventDetail.EndDate, "ddd, mmm d, yyyy") &
                                          If(IsBlank(varEventDetail.EventType), "", "  ·  " & varEventDetail.EventType) &
                                          If(IsBlank(varEventDetail.Location), "", "  ·  ⌖ " & varEventDetail.Location) &
                                          If(IsBlank(varEventDetail.Department), "", "  ·  " & varEventDetail.Department))
                                    Height: =24
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(55, 63, 75, 1)
                              - recHeroDiv_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: =""
                                    Height: =1
                                    FillPortions: =0
                                    Fill: =RGBA(228, 231, 239, 1)
                              - lblMyRegHead_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      ="My Registration" & If(CountRows(colMyEvRegs_EvD) > 1, "s (" & CountRows(colMyEvRegs_EvD) & ")", "")
                                    Height: =24
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =14
                                    FontWeight: =FontWeight.Bold
                                    Color: =RGBA(23, 32, 51, 1)
                              - lblNoMyReg_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="You haven't registered for this event yet. Pick a session below to register."
                                    Height: =48
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Wrap: =true
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    Color: =RGBA(104, 115, 138, 1)
                                    Fill: =RGBA(246, 247, 251, 1)
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    Visible: =IsEmpty(colMyEvRegs_EvD)
                              - galMyEvRegs_EvD:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    TemplateSize: =330
                                    TemplatePadding: =4
                                    ShowScrollbar: =false
                                    Visible: =!IsEmpty(colMyEvRegs_EvD)
                                    Items: =colMyEvRegs_EvD
                                  Children:
                                    - recMyRegCard_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =""
                                          X: =0
                                          Y: =2
                                          Width: =Parent.TemplateWidth - 10
                                          Height: =Parent.TemplateHeight - 6
                                          Fill: =RGBA(246, 247, 251, 1)
                                          BorderColor: =RGBA(228, 231, 239, 1)
                                          BorderThickness: =1
                                          RadiusTopLeft: =10
                                          RadiusTopRight: =10
                                          RadiusBottomLeft: =10
                                          RadiusBottomRight: =10
                                    - recMyRegDateBox_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =""
                                          X: =12
                                          Y: =14
                                          Width: =48
                                          Height: =48
                                          Fill: =RGBA(232, 234, 238, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                    - lblMyRegMon_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Upper(Text(ThisItem.SessionDate, "mmm"))
                                          X: =12
                                          Y: =18
                                          Width: =48
                                          Height: =16
                                          AutoHeight: =true
                                          Size: =10
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          Color: =RGBA(55, 63, 75, 1)
                                    - lblMyRegDay_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Text(ThisItem.SessionDate, "dd")
                                          X: =12
                                          Y: =33
                                          Width: =48
                                          Height: =24
                                          AutoHeight: =true
                                          Size: =14
                                          FontWeight: =FontWeight.Bold
                                          Align: =Align.Center
                                          Color: =RGBA(55, 63, 75, 1)
                                    - lblMyRegBadge_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =If(ThisItem.SessionDate < Today(), "Past", "Confirmed ✓")
                                          X: =Parent.TemplateWidth - 122
                                          Y: =14
                                          Width: =104
                                          Height: =22
                                          AutoHeight: =true
                                          Size: =11
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          Fill: |-
                                            =If(ThisItem.SessionDate < Today(),
                                                RGBA(238, 240, 246, 1), RGBA(233, 248, 241, 1))
                                          Color: |-
                                            =If(ThisItem.SessionDate < Today(),
                                                RGBA(104, 115, 138, 1), RGBA(21, 150, 106, 1))
                                          RadiusTopLeft: =11
                                          RadiusTopRight: =11
                                          RadiusBottomLeft: =11
                                          RadiusBottomRight: =11
                                    - lblMyRegTime_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Text(ThisItem.SessionDate, "ddd, mmm d")
                                          X: =70
                                          Y: =40
                                          Width: =Parent.TemplateWidth - 200
                                          Height: =20
                                          AutoHeight: =true
                                          Size: =12
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                    - lblMyRegRef_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =ThisItem.TimeSlot & "  ·  WSR-" & Text(ThisItem.ID)
                                          X: =70
                                          Y: =62
                                          Width: =Parent.TemplateWidth - 90
                                          Height: =18
                                          AutoHeight: =true
                                          Size: =11
                                          Color: =RGBA(104, 115, 138, 1)
                                    - btnMyRegCancel_EvD:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="Cancel"
                                          X: =12
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Outline
                                          Color: =RGBA(216, 75, 82, 1)
                                          BorderColor: =RGBA(239, 183, 187, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =Set(varCancelTarget, ThisItem);
                                            Set(varShowCancelEvD, true)
                                    - btnMyRegSwitch_EvD:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="⇄ Switch"
                                          X: =12 + (Parent.TemplateWidth - 46) / 3 + 6
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Secondary
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =Set(varSwitchRegID, ThisItem.ID);
                                            Set(varSwitchRegLabel, Text(ThisItem.SessionDate, "ddd, mmm d") & " · " & ThisItem.TimeSlot);
                                            Set(varSelectedEvent,
                                                {ID: varEventDetail.ID, Title: varEventDetail.Title, Description: varEventDetail.Description,
                                                 StartDate: varEventDetail.StartDate, EndDate: varEventDetail.EndDate, Location: varEventDetail.Location,
                                                 EventType: varEventDetail.EventType, CutoffHours: Coalesce(varEventDetail.RegistrationCutoffHours, 48),
                                                 MaxPerUser: Coalesce(varEventDetail.MaxPerUser, 0), MeetingLink: varEventDetail.MeetingLink,
                                                 Coordinator: varEventDetail.Coordinator, POC: varEventDetail.POC, POCEmail: varEventDetail.POCEmail});
                                            Set(varDetailEvent, varSelectedEvent);
                                            Set(varSelectedSlot, Blank());
                                            Set(varCalDate, ThisItem.SessionDate);
                                            Set(varDeepLink, true);
                                            Navigate(scrRegister, ScreenTransition.Fade)
                                    - btnMyRegAddCal_EvD:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="📅 Calendar"
                                          X: =12 + 2 * ((Parent.TemplateWidth - 46) / 3 + 6)
                                          Y: =Parent.TemplateHeight - 50
                                          Width: =(Parent.TemplateWidth - 46) / 3
                                          Height: =38
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Secondary
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          DisplayMode: =If(ThisItem.SessionDate < Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =With({p: Split(ThisItem.TimeSlot, " – "),
                                                  ml: Coalesce(varEventDetail.MeetingLink, ""),
                                                  loc: Coalesce(varEventDetail.Location, "")},
                                                With({startDT: ThisItem.SessionDate + IfError(TimeValue(First(p).Value), Time(9, 0, 0)),
                                                      endDT: ThisItem.SessionDate + IfError(TimeValue(Last(p).Value), Time(15, 0, 0))},
                                                    If(IsError(
                                                        EventSessionRegistration_AddToCalendar.Run(
                                                            Coalesce(ThisItem.EventName, "Session") & " - " & ThisItem.TimeSlot,
                                                            "Your registered session." & Char(10) &
                                                                "Event: " & Coalesce(ThisItem.EventName, "") & Char(10) &
                                                                "Time: " & ThisItem.TimeSlot & Char(10) &
                                                                "Reference: WSR-" & ThisItem.ID &
                                                                If(ml = "", "", Char(10) & "Meeting link: " & ml),
                                                            Text(startDT, "yyyy-mm-ddThh:mm:ss"),
                                                            Text(endDT, "yyyy-mm-ddThh:mm:ss"),
                                                            loc)),
                                                        Notify("Could not add to your calendar. Check that the EventSessionRegistration_AddToCalendar flow is connected.", NotificationType.Error),
                                                        Notify("Added to your Outlook calendar.", NotificationType.Success))))
                        # Sessions card
                        - conSessions_EvD:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              PaddingTop: =16
                              PaddingBottom: =12
                              PaddingLeft: =22
                              PaddingRight: =22
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - conSessHead_EvD:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =40
                                    FillPortions: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    Fill: =RGBA(0, 0, 0, 0)
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblSessionsHead_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: ="Upcoming Sessions (" & CountRows(colEventDetailSlots) & ")"
                                          Height: =28
                                          FillPortions: =1
                                          Size: =13
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                    - htmlLegend_EvD:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          HtmlText: |-
                                            ="<div style='line-height:34px;white-space:nowrap;text-align:right'>" &
                                            "<span style='color:#373F4B'>&#9679;</span> Registered &nbsp; " &
                                            "<span style='color:#15966A'>&#9679;</span> Open &nbsp; " &
                                            "<span style='color:#C77A00'>&#9679;</span> Few spots &nbsp; " &
                                            "<span style='color:#D84B52'>&#9679;</span> Full</div>"
                                          Width: =330
                                          Height: =34
                                          AutoHeight: =true
                                          FillPortions: =0
                                          Size: =11
                                          Font: =Font.'Segoe UI'
                                          Color: =RGBA(104, 115, 138, 1)
                                          BorderStyle: =BorderStyle.None
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                    - btnEvListView_EvD:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="☷ List"
                                          Width: =80
                                          Height: =34
                                          FillPortions: =0
                                          Size: =13
                                          Appearance: =If(varEvDetView = "calendar", ButtonAppearance.Secondary, ButtonAppearance.Primary)
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: =Set(varEvDetView, "list")
                                    - btnEvCalView_EvD:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: ="▦ Calendar"
                                          Width: =110
                                          Height: =34
                                          FillPortions: =0
                                          Size: =13
                                          Appearance: =If(varEvDetView = "calendar", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: =Set(varEvDetView, "calendar")
                              - lblNoSlots_EvD:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="No upcoming sessions have been scheduled for this event yet. Check back soon."
                                    Height: =48
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Wrap: =true
                                    Align: =Align.Center
                                    Color: =RGBA(104, 115, 138, 1)
                                    Fill: =RGBA(246, 247, 251, 1)
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    Visible: =IsEmpty(colEventDetailSlots)
                              - galEvSlots_EvD:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    TemplateSize: =56
                                    TemplatePadding: =0
                                    ShowScrollbar: =false
                                    OnSelect: =Set(varEvDetSelSlot, ThisItem)
                                    Visible: =varEvDetView <> "calendar" && !IsEmpty(colEventDetailSlots)
                                    Items: |-
                                      =AddColumns(
                                          SortByColumns(colEventDetailSlots, "SessionDate", SortOrder.Ascending, "SortOrder", SortOrder.Ascending),
                                          Registered, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId))),
                                          Mine, With({slotId: ID}, CountRows(Filter(colFutureRegs, SlotID = slotId, UserEmail = Lower(User().Email)))),
                                          SlotStart, If(IsBlank(ThisRecord.DurationMinutes),
                                              DateAdd(ThisRecord.SessionDate, Switch(ThisRecord.SortOrder, 1, 9, 2, 10, 3, 11, 4, 13, 5, 14, 9), TimeUnit.Hours),
                                              DateAdd(ThisRecord.SessionDate, ThisRecord.SortOrder, TimeUnit.Minutes)),
                                          CutoffH, Coalesce(varEventDetail.RegistrationCutoffHours, 48))
                                  Children:
                                    - lblSlotDate_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =Text(ThisItem.SessionDate, "ddd, mmm d, yyyy")
                                          X: =4
                                          Y: =14
                                          Width: =Parent.TemplateWidth * 0.26
                                          Height: =28
                                          AutoHeight: =true
                                          Size: =13
                                          FontWeight: =If(varEvDetSelSlot.ID = ThisItem.ID, FontWeight.Bold, FontWeight.Normal)
                                          Color: =RGBA(23, 32, 51, 1)
                                          OnSelect: =Select(Parent)
                                    - lblSlotTime_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =ThisItem.Title
                                          X: =Parent.TemplateWidth * 0.28
                                          Y: =14
                                          Width: =Parent.TemplateWidth * 0.24
                                          Height: =28
                                          AutoHeight: =true
                                          Size: =13
                                          FontWeight: =FontWeight.Bold
                                          Color: =RGBA(23, 32, 51, 1)
                                          OnSelect: =Select(Parent)
                                    - lblSlotBadge_EvD:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: |-
                                            =If(ThisItem.Mine > 0, "Registered ✓",
                                                ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours), "Closed",
                                                With({left: ThisItem.Capacity - ThisItem.Registered},
                                                    If(left = 0, "Full", left & " spots left")))
                                          X: =Parent.TemplateWidth * 0.54
                                          Y: =15
                                          Width: =120
                                          Height: =26
                                          AutoHeight: =true
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Align: =Align.Center
                                          Fill: |-
                                            =If(ThisItem.Mine > 0, RGBA(55, 63, 75, 1),
                                                ThisItem.SlotStart < DateAdd(Now(), ThisItem.CutoffH, TimeUnit.Hours), RGBA(238, 240, 246, 1),
                                                With({left: ThisItem.Capacity - ThisItem.Registered},
                                                    If(left = 0, RGBA(253, 236, 238, 1),
                                                       left <= 4, RGBA(255, 244, 223, 1),
                                                       RGBA(233, 248, 241, 1))))
