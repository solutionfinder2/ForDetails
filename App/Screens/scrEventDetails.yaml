                        RadiusTopRight: =16
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        OnSelect: =Remove(colShareEvTo, ThisItem)
            - lblShareEvToHint:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Results appear as you type - click a person to add them; click a chip to remove."
                  X: =24
                  Y: =196
                  Width: =Parent.Width - 48
                  Height: =16
                  AutoHeight: =true
                  Size: =11
                  Color: =RGBA(104, 115, 138, 1)
            - lblShareEvSubject:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Subject"
                  X: =24
                  Y: =224
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtShareEvSubject:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =246
                  Width: =Parent.Width - 48
                  Height: =36
                  Size: =13
                  Default: |-
                    ="Invitation: " & If(IsBlank(varEventDetail), "", varEventDetail.Title)
                  Type: =TextInputType.SingleLine
            - lblShareEvBody:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Message"
                  X: =24
                  Y: =298
                  Width: =Parent.Width - 48
                  Height: =18
                  AutoHeight: =true
                  Size: =12
                  FontWeight: =FontWeight.Semibold
                  Color: =RGBA(23, 32, 51, 1)
            - txtShareEvBody:
                Control: ModernTextInput@1.0.0
                Properties:
                  X: =24
                  Y: =320
                  Width: =Parent.Width - 48
                  Height: =130
                  Size: =13
                  Default: |-
                    ="Hi," & Char(10) & Char(10) &
                     "I'd like to share this event with you: " & If(IsBlank(varEventDetail), "", varEventDetail.Title) & "." & Char(10) &
                     "Use the link below to see the details and register." & Char(10) & Char(10) &
                     "Shared by " & varUserName
                  Type: =TextInputType.Multiline
            - lblShareEvLink:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(IsBlank(varAppURL),
                        "⚠ No app link configured - set varAppURL in App.OnStart to the app's web link first.",
                        "Link: " & varAppURL & If(IsBlank(Find("?", varAppURL)), "?", "&") & "eventid=" & varDetailEventID)
                  X: =24
                  Y: =460
                  Width: =Parent.Width - 48
                  Height: =48
                  AutoHeight: =true
                  Size: =11
                  Wrap: =true
                  Color: |-
                    =If(IsBlank(varAppURL), RGBA(199, 122, 0, 1), RGBA(104, 115, 138, 1))
            - btnShareEvCopy:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="⧉ Copy Link"
                  X: =24
                  Y: =Parent.Height - 64
                  Width: =130
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(IsBlank(varAppURL),
                        Notify("No app link configured - set varAppURL in App.OnStart first.", NotificationType.Warning),
                        IfError(
                            Copy(varAppURL & If(IsBlank(Find("?", varAppURL)), "?", "&") & "eventid=" & varDetailEventID),
                            Notify("Could not access the clipboard in this browser.", NotificationType.Error),
                            Notify("Link copied.", NotificationType.Success)))
            - btnShareEvCancel:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Cancel"
                  X: =Parent.Width - 336
                  Y: =Parent.Height - 64
                  Width: =140
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Secondary
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: =Set(varShowShareEv, false)
            - btnShareEvSend:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Send"
                  X: =Parent.Width - 184
                  Y: =Parent.Height - 64
                  Width: =160
                  Height: =40
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Appearance: =ButtonAppearance.Primary
                  BasePaletteColor: =RGBA(55, 63, 75, 1)
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  OnSelect: |-
                    =If(CountRows(colShareEvTo) = 0,
                        Notify("Pick at least one recipient.", NotificationType.Warning),
                        IsBlank(varAppURL),
                        Notify("No app link configured - set varAppURL in App.OnStart to the app's web link first.", NotificationType.Warning),
                        With({link: varAppURL & If(IsBlank(Find("?", varAppURL)), "?", "&") & "eventid=" & varDetailEventID},
                            If(IsError(EventSessionRegistration_ShareEvent.Run(
                                    Concat(colShareEvTo, Mail, ";"),
                                    Trim(txtShareEvSubject.Text),
                                    txtShareEvBody.Text,
                                    varEventDetail.Title,
                                    link)),
                                Notify("Could not send. Check that the EventSessionRegistration_ShareEvent flow is connected and turned on.", NotificationType.Error),
                                Set(varShowShareEv, false);
                                Notify("Event shared with " & Concat(colShareEvTo, DisplayName, ", "), NotificationType.Success))))
            # Suggestion dropdown - declared last so it renders on top of the fields below it
            - galShareEvSug:
                Control: Gallery
                Variant: Vertical
                Properties:
                  X: =24
                  Y: =152
                  Width: =Parent.Width - 48
                  Height: =176
                  TemplateSize: =44
                  TemplatePadding: =0
                  ShowScrollbar: =true
                  Visible: =!IsBlank(Trim(txtShareEvSearch.Text))
                  Items: |-
                    =Office365Users.SearchUser({searchTerm: Trim(txtShareEvSearch.Text), top: 8})
                  OnSelect: |-
                    =If(IsBlank(LookUp(colShareEvTo, Lower(Mail) = Lower(ThisItem.Mail))),
                        Collect(colShareEvTo, {DisplayName: ThisItem.DisplayName, Mail: ThisItem.Mail}));
                    Reset(txtShareEvSearch)
                Children:
                  - recShareEvSugBg:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =""
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderColor: =RGBA(228, 231, 239, 1)
                        BorderThickness: =1
                        OnSelect: =Select(Parent)
                  - lblShareEvSugName:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =ThisItem.DisplayName
                        X: =12
                        Y: =4
                        Width: =Parent.TemplateWidth - 24
                        Height: =18
                        AutoHeight: =true
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =RGBA(23, 32, 51, 1)
                        OnSelect: =Select(Parent)
                  - lblShareEvSugMail:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: =Lower(Coalesce(ThisItem.Mail, ""))
                        X: =12
                        Y: =22
                        Width: =Parent.TemplateWidth - 24
                        Height: =16
                        AutoHeight: =true
                        Size: =11
                        Color: =RGBA(104, 115, 138, 1)
                        OnSelect: =Select(Parent)
