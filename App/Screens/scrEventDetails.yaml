      # ---------------- SHARE EVENT MODAL (screen level, on top) ----------------
      - recShareEvOverlay:
          Control: ModernText@1.0.0
          Properties:
            Text: =""
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(20, 24, 42, 0.45)
            Visible: =varShowShareEv
            OnSelect: =Set(varShowShareEv, false)
      - conShareEvModal:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - 560) / 2
            Y: =Max(12, (Parent.Height - 600) / 2)
            Width: =560
            Height: =600
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =14
            RadiusTopRight: =14
            RadiusBottomLeft: =14
            RadiusBottomRight: =14
            Visible: =varShowShareEv
          Children:
            - lblShareEvTitle:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Share Event"
                  X: =24
                  Y: =20
                  Width: =Parent.Width - 48
                  Height: =30
                  AutoHeight: =true
                  Size: =14
                  FontWeight: =FontWeight.Bold
                  Color: =RGBA(23, 32, 51, 1)
            - lblShareEvName:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    =If(IsBlank(varEventDetail), "",
                        varEventDetail.Title & "  •  " &
                        Text(varEventDetail.StartDate, "mmm d") & " – " & Text(varEventDetail.EndDate, "mmm d, yyyy"))
