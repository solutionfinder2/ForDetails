                                                      Width: =Parent.TemplateWidth - 12
                                                      Height: =18
                                                      AutoHeight: =true
                                                      Size: =10
                                                      FontWeight: =FontWeight.Bold
                                                      Align: =Align.Center
                                                      Visible: =ThisItem.SlotCount > 0
                                                      Fill: |-
                                                        =If(ThisItem.DayDate = varRegCalSel, RGBA(255, 255, 255, 1),
