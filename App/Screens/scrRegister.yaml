                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: =Set(varRegStep, varRegStep - 1)
                                    # -------------------------------------------------
                                    # BACKUP - confirmation/switch email WITHOUT the
                                    # EmailTemplates list. In the OnSelect below,
                                    # replace the whole With({tplKey: ...}) block
                                    # (through its closing "))));") with:
                                    #
                                    #   If(IsError(
                                    #       EventSessionRegistration_SendAppEmail.Run(
                                    #           varNewReg.UserEmail,
                                    #           If(varWasSwitch, "Session Switched - ", "Registration Confirmed - ") &
                                    #               Coalesce(varNewReg.EventName, "Session") & " (WSR-" & Text(varNewReg.ID) & ")",
                                    #           "Hi " & varNewReg.UserName & "," & Char(10) & Char(10) &
                                    #           If(varWasSwitch,
                                    #               "Your registration has been moved to the session below.",
                                    #               "Your registration is confirmed.") & Char(10) & Char(10) &
                                    #           "Event: " & Coalesce(varNewReg.EventName, "—") & Char(10) &
                                    #           "Date: " & Text(varNewReg.SessionDate, "dddd, mmmm d, yyyy") & Char(10) &
                                    #           "Time: " & varNewReg.TimeSlot & Char(10) &
                                    #           "Reference: WSR-" & Text(varNewReg.ID) &
                                    #           With({ml: Coalesce(LookUp(EventSessionRegistration_Events, ID = varNewReg.EventID, MeetingLink), "")},
                                    #               If(ml = "", "", Char(10) & "Meeting link: " & ml)))),
                                    #       Notify("Registered, but the confirmation email could not be sent.", NotificationType.Warning));
                                    # -------------------------------------------------
                                    - btnNext_Reg:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Text: =If(varRegStep = 4, If(Coalesce(varSwitchRegID, 0) = 0, "Confirm Registration", "Confirm Switch"), "Next →")
                                          Width: =If(varRegStep = 4, 210, 112)
                                          Height: =40
                                          FillPortions: =0
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Appearance: =ButtonAppearance.Primary
                                          BasePaletteColor: =RGBA(55, 63, 75, 1)
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          OnSelect: |-
                                            =If(varRegStep = 1,
                                                If(IsBlank(varSelectedEvent),
                                                    Notify("Please select an event first.", NotificationType.Warning),
                                                    Set(varRegStep, 2)),
                                            varRegStep = 2,
                                                If(IsBlank(varSelectedSlot),
                                                    Notify("Please select an available time slot.", NotificationType.Warning),
                                                    Set(varRegStep, 3)),
                                            varRegStep = 3,
                                                Set(varRegStep, 4),
                                            ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
                                            With({seats: CountRows(Filter(colFutureRegs, SlotID = varSelectedSlot.ID)),
                                                  mine: CountRows(Filter(colFutureRegs, SlotID = varSelectedSlot.ID, UserEmail = Lower(User().Email))),
                                                  clash: CountRows(Filter(colFutureRegs,
                                                      SessionDate = varSelectedSlot.SessionDate,
                                                      TimeSlot = varSelectedSlot.Title,
                                                      UserEmail = Lower(User().Email),
                                                      ID <> Coalesce(varSwitchRegID, 0))),
                                                  evMine: CountRows(Filter(colFutureRegs,
                                                      EventID = varSelectedEvent.ID,
                                                      UserEmail = Lower(User().Email)))},
                                                If(mine > 0,
                                                    Notify("You are already registered for this time slot.", NotificationType.Warning),
                                                clash > 0,
                                                    Notify("You already have a registration at this date and time (another event's session). Switch or cancel it first.", NotificationType.Warning),
                                                Coalesce(varSwitchRegID, 0) = 0 && varSelectedEvent.MaxPerUser > 0 && evMine >= varSelectedEvent.MaxPerUser,
                                                    Notify(If(varSelectedEvent.MaxPerUser = 1,
                                                        "This event allows one session per person, and you're already registered. Use Switch on your existing registration in My Registrations to change sessions.",
                                                        "This event allows up to " & varSelectedEvent.MaxPerUser & " sessions per person, and you've reached that limit."), NotificationType.Warning),
                                                varSelectedSlot.SlotStart < DateAdd(Now(), If(Coalesce(varSwitchRegID, 0) = 0, Coalesce(varSelectedEvent.CutoffHours, 48), 0), TimeUnit.Hours),
                                                    Notify(If(Coalesce(varSwitchRegID, 0) = 0,
                                                        "Registration closes " & Coalesce(varSelectedEvent.CutoffHours, 48) & " hours before the session starts.",
                                                        "This session has already started. Please pick another."), NotificationType.Warning),
                                                seats >= varSelectedSlot.Capacity,
                                                    Notify("Sorry, this slot just filled up. Please pick another.", NotificationType.Error),
                                                Set(varNewReg,
                                                    If(Coalesce(varSwitchRegID, 0) = 0,
                                                        Patch(EventSessionRegistration_Registrations, Defaults(EventSessionRegistration_Registrations),
                                                            {Title: varSelectedSlot.Title & " on " & Text(varSelectedSlot.SessionDate, "yyyy-mm-dd"),
                                                             SlotID: varSelectedSlot.ID,
                                                             SessionDate: varSelectedSlot.SessionDate,
                                                             TimeSlot: varSelectedSlot.Title,
                                                             EventID: varSelectedSlot.EventID,
                                                             EventName: varSelectedSlot.EventName,
                                                             UserName: User().FullName,
                                                             UserEmail: Lower(User().Email),
                                                             Status: "Confirmed"}),
                                                        Patch(EventSessionRegistration_Registrations, LookUp(EventSessionRegistration_Registrations, ID = varSwitchRegID),
                                                            {Title: varSelectedSlot.Title & " on " & Text(varSelectedSlot.SessionDate, "yyyy-mm-dd"),
                                                             SlotID: varSelectedSlot.ID,
                                                             SessionDate: varSelectedSlot.SessionDate,
                                                             TimeSlot: varSelectedSlot.Title,
                                                             EventID: varSelectedSlot.EventID,
                                                             EventName: varSelectedSlot.EventName,
                                                             Status: "Confirmed"})));
                                                Set(varWasSwitch, Coalesce(varSwitchRegID, 0) > 0);
                                                With({tplKey: If(varWasSwitch, "SessionSwitched", "RegistrationConfirmed")},
                                                With({tpl: LookUp(EventSessionRegistration_EmailTemplates, TemplateKey = tplKey),
                                                      link: Coalesce(LookUp(EventSessionRegistration_Events, ID = varNewReg.EventID, MeetingLink), "")},
                                                    If(IsBlank(tpl),
                                                        Notify("Registered, but no confirmation email was sent - the '" & tplKey & "' template is missing from the EmailTemplates list.", NotificationType.Warning),
                                                        tpl.IsActive,
                                                        If(IsError(
                                                            EventSessionRegistration_SendAppEmail.Run(
                                                                varNewReg.UserEmail,
                                                                Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(tpl.Subject,
                                                                    "{UserName}", varNewReg.UserName),
                                                                    "{EventName}", Coalesce(varNewReg.EventName, "")),
                                                                    "{SessionDate}", Text(varNewReg.SessionDate, "dddd, mmmm d, yyyy")),
                                                                    "{TimeSlot}", varNewReg.TimeSlot),
                                                                    "{MeetingLink}", link),
                                                                    "{ReferenceID}", "WSR-" & Text(varNewReg.ID)),
                                                                Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(tpl.Body,
                                                                    "{UserName}", varNewReg.UserName),
                                                                    "{EventName}", Coalesce(varNewReg.EventName, "")),
                                                                    "{SessionDate}", Text(varNewReg.SessionDate, "dddd, mmmm d, yyyy")),
                                                                    "{TimeSlot}", varNewReg.TimeSlot),
                                                                    "{MeetingLink}", link),
                                                                    "{ReferenceID}", "WSR-" & Text(varNewReg.ID)))),
                                                            Notify("Registered, but the confirmation email could not be sent.", NotificationType.Warning)))));
                                                Set(varSwitchRegID, 0);
                                                Set(varSwitchRegLabel, "");
                                                Set(varRegStep, 1);
                                                Set(varSelectedSlot, Blank());
                                                Set(varSelectedEvent, Blank());
                                                Set(varDetailEvent, Blank());
                                                ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
                                                Set(varShowConfirmModal, true))))
