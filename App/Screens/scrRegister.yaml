                                                            Notify(If(Coalesce(varSwitchRegID, 0) = 0,
                                                                "Registration closes " & Coalesce(varSelectedEvent.CutoffHours, 48) & " hours before the session starts.",
                                                                "This session has already started."), NotificationType.Warning),
                                                        ThisItem.Capacity - ThisItem.Registered <= 0,
                                                            Notify("This session is full.", NotificationType.Warning),
                                                        Set(varSelectedSlot, ThisItem))
