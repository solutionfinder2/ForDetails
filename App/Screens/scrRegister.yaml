                                                            ThisItem.SlotStart < DateAdd(Now(), If(Coalesce(varSwitchRegID, 0) = 0, Coalesce(varSelectedEvent.CutoffHours, 48), 0), TimeUnit.Hours), RGBA(104, 115, 138, 1),
