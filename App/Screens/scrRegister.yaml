# =============================================================
# scrRegister - Slot selection screen (RESPONSIVE, MODERN CONTROLS)
# Root horizontal container: fixed sidebar (245) + flexible main area.
# Register layout: slot panel (2 portions) + summary panel (1 portion).
# =============================================================
Screens:
  scrRegister:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: |-
        =ClearCollect(colFutureRegs, Filter(EventSessionRegistration_Registrations, Status = "Confirmed", SessionDate >= Today()));
        ClearCollect(colRegVisibleEvents, Filter(EventSessionRegistration_Events, IsActive = true, EndDate >= Today()));
        ClearCollect(colRestrictedEv_Reg, Filter(colRegVisibleEvents, !IsBlank(AudienceGroupID)));
        ForAll(colRestrictedEv_Reg,
            With({gid: AudienceGroupID, evid: ID},
                With({member: IfError(
                        LookUp(Office365Groups.ListGroupMembers(gid).value,
                            Lower(Coalesce(mail, userPrincipalName)) = Lower(User().Email)),
                        Blank())},
                    If(IsBlank(member),
                        Remove(colRegVisibleEvents, LookUp(colRegVisibleEvents, ID = evid))))));
        Set(varRegView, "calendar");
        If(varDeepLink,
            Set(varDeepLink, false);
            Set(varRegStep, 2);
            ClearCollect(colRegEventSlots, Filter(EventSessionRegistration_SessionTimeSlots, EventID = varSelectedEvent.ID, IsActive = true, SessionDate >= Today()));
            Set(varRegCalSel, Coalesce(varCalDate, Today()));
            Set(varRegCalMonth, Date(Year(varRegCalSel), Month(varRegCalSel), 1)),
            Set(varRegStep, 1);
            Set(varSelectedEvent, Blank());
            Set(varDetailEvent, Blank());
            Set(varSelectedSlot, Blank());
            Set(varCalDate, Blank());
            Set(varSwitchRegID, 0);
            Set(varSwitchRegLabel, "");
            Clear(colRegEventSlots);
            Set(varRegCalSel, Today());
            Set(varRegCalMonth, Date(Year(Today()), Month(Today()), 1)))
    Children:
      - imgBackground_Reg:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_Reg:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
