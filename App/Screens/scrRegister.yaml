                                                          AddColumns(Sequence(42),
                                                              DayDate, DateAdd(first, Value - 1, TimeUnit.Days),
                                                              SlotCount, With({d: DateAdd(first, Value - 1, TimeUnit.Days)},
                                                                  CountRows(Filter(colRegEventSlots, SessionDate = d))),
                                                              MineDay, With({d: DateAdd(first, Value - 1, TimeUnit.Days)},
                                                                  CountRows(Filter(colFutureRegs, EventID = varSelectedEvent.ID, UserEmail = Lower(User().Email), SessionDate = d))),
                                                              RemainDay, With({d: DateAdd(first, Value - 1, TimeUnit.Days)},
                                                                  Sum(Filter(colRegEventSlots, SessionDate = d),
                                                                      With({slotId: ID}, Max(0, Capacity - CountRows(Filter(colFutureRegs, SlotID = slotId)))))))))
