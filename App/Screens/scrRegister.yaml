                                                            ThisItem.RemainDay = 0, RGBA(253, 236, 238, 1),
                                                            ThisItem.RemainDay <= 4, RGBA(255, 244, 223, 1),
                                                            RGBA(233, 248, 241, 1))
                                                      Color: |-
                                                        =If(ThisItem.DayDate = varRegCalSel, RGBA(55, 63, 75, 1),
                                                            ThisItem.MineDay > 0, RGBA(255, 255, 255, 1),
                                                            ThisItem.RemainDay = 0, RGBA(216, 75, 82, 1),
                                                            ThisItem.RemainDay <= 4, RGBA(199, 122, 0, 1),
                                                            RGBA(21, 150, 106, 1))
