# =============================================================
# scrTest - DUMMY SCREEN FOR TESTING (safe to edit or delete)
# Not linked from anywhere in the app. Navigate to it manually in
# Studio (Tree view > scrTest) or temporarily wire a button to:
#   Navigate(scrTest, ScreenTransition.Fade)
# Contains: a live debug card (user / role / key variables) and a
# small playground area (input, buttons, notification tests).
# Nothing on this screen writes to SharePoint.
# =============================================================
Screens:
  scrTest:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
      OnVisible: =Set(varTestCounter, Coalesce(varTestCounter, 0))
    Children:
      - conRoot_Tst:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =14
            PaddingTop: =20
            PaddingBottom: =20
            PaddingLeft: =28
            PaddingRight: =28
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- HEADER ----------------
            - conHeader_Tst:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =44
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =14
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  - btnBack_Tst:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="← Back"
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        Size: =14
                        FontWeight: =FontWeight.Semibold
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =RGBA(55, 63, 75, 1)
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        OnSelect: =Back(ScreenTransition.Fade)
                  - lblHeader_Tst:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="🧪 Test Screen"
                        Height: =40
                        FillPortions: =1
                        Size: =18
                        FontWeight: =FontWeight.Bold
                        Color: =RGBA(23, 32, 51, 1)
                  - lblTestChip_Tst:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="TESTING ONLY"
                        Width: =130
                        Height: =30
                        AutoHeight: =true
                        FillPortions: =0
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                        Fill: =RGBA(255, 244, 223, 1)
                        Color: =RGBA(199, 122, 0, 1)
                        RadiusTopLeft: =15
                        RadiusTopRight: =15
                        RadiusBottomLeft: =15
                        RadiusBottomRight: =15
            # ---------------- BODY: two cards side by side ----------------
            - conBody_Tst:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  LayoutWrap: =true
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                Children:
                  # LEFT: live debug info
                  - conDebug_Tst:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =340
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =6
                        PaddingTop: =18
                        PaddingBottom: =18
                        PaddingLeft: =22
                        PaddingRight: =22
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderColor: =RGBA(228, 231, 239, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =13
                        RadiusTopRight: =13
                        RadiusBottomLeft: =13
                        RadiusBottomRight: =13
                      Children:
                        - lblDebugHead_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Session Info (live)"
                              Height: =28
                              AutoHeight: =true
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(23, 32, 51, 1)
                        - lblDebugInfo_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                ="User:  " & User().FullName & Char(10) &
                                "Email:  " & Lower(User().Email) & Char(10) &
                                "Role:  " & Coalesce(varMyRole, "(not set)") & Char(10) &
                                "Is Admin:  " & If(Coalesce(varIsAdmin, false), "Yes", "No") & Char(10) &
                                "Is Coordinator:  " & If(Coalesce(varIsCoordinator, false), "Yes", "No") & Char(10) &
                                "Sidebar open:  " & If(Coalesce(varSidebarOpen, false), "Yes", "No") & Char(10) &
                                "Now:  " & Text(Now(), "ddd, mmm d, yyyy h:mm:ss AM/PM") & Char(10) &
                                "Screen size:  " & App.Width & " × " & App.Height & Char(10) &
                                "Selected event ID:  " & Coalesce(Text(varDetailEventID), "(none)") & Char(10) &
                                "Test counter:  " & Coalesce(varTestCounter, 0)
                              FillPortions: =1
                              Size: =13
                              Wrap: =true
                              VerticalAlign: =VerticalAlign.Top
                              Color: =RGBA(55, 63, 75, 1)
                              Fill: =RGBA(246, 247, 251, 1)
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                  # RIGHT: playground
                  - conPlay_Tst:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =340
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =10
                        PaddingTop: =18
                        PaddingBottom: =18
                        PaddingLeft: =22
                        PaddingRight: =22
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderColor: =RGBA(228, 231, 239, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =13
                        RadiusTopRight: =13
                        RadiusBottomLeft: =13
                        RadiusBottomRight: =13
                      Children:
                        - lblPlayHead_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Playground (safe to click - nothing is saved)"
                              Height: =28
                              AutoHeight: =true
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(23, 32, 51, 1)
                        - txtPlay_Tst:
                            Control: ModernTextInput@1.0.0
                            Properties:
                              Height: =38
                              FillPortions: =0
                              Size: =13
                              Default: =""
                              Placeholder: ="Type anything here…"
                              Type: =TextInputType.SingleLine
                        - lblEcho_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                =If(IsBlank(txtPlay_Tst.Text), "Your text echoes here as you type.",
                                    "You typed: " & txtPlay_Tst.Text)
                              Height: =40
                              AutoHeight: =true
                              FillPortions: =0
                              Size: =12
                              Wrap: =true
                              Color: =RGBA(104, 115, 138, 1)
                        - btnCounter_Tst:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Counter +1  (now " & Coalesce(varTestCounter, 0) & ")"
                              Height: =40
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: =Set(varTestCounter, Coalesce(varTestCounter, 0) + 1)
                        - btnNotifySuccess_Tst:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Show success notification"
                              Height: =40
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: =Notify("This is a success notification.", NotificationType.Success)
                        - btnNotifyWarn_Tst:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Show warning notification"
                              Height: =40
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: =Notify("This is a warning notification.", NotificationType.Warning)
                        - btnNotifyError_Tst:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Show error notification"
                              Height: =40
                              FillPortions: =0
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =RGBA(55, 63, 75, 1)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: =Notify("This is an error notification.", NotificationType.Error)
                        - recPlaySpacer_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =""
                              FillPortions: =1
                              Fill: =RGBA(0, 0, 0, 0)
                        - lblPlayHint_Tst:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="This screen is a sandbox - drop any control here to try it out, then delete the screen (or leave it; nothing links to it)."
                              Height: =40
                              AutoHeight: =true
                              FillPortions: =0
                              Size: =11
                              Wrap: =true
                              Color: =RGBA(104, 115, 138, 1)
