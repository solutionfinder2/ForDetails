                            Control: Image
                            Properties:
                              X: =4
                              Y: =8
                              Width: =48
                              Height: =48
                              ImagePosition: =ImagePosition.Fit
                              Fill: =RGBA(255, 255, 255, 0.08)
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              OnSelect: =Navigate(scrIntro, ScreenTransition.Fade)
                        - lblBrand_Prof:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="ACME"
                              X: =60
                              Y: =8
                              Width: =Parent.Width - 60
                              Height: =48
                              Size: =22
                              FontWeight: =FontWeight.Bold
                              Color: =RGBA(255, 255, 255, 1)
                              OnSelect: =Navigate(scrIntro, ScreenTransition.Fade)
                        - lblBrandSub_Prof:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Weekly Session Registration"
                              X: =4
                              Y: =62
                              Width: =Parent.Width - 8
                              Height: =24
                              AutoHeight: =true
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Color: =RGBA(158, 165, 177, 1)
                              Wrap: =true
                              OnSelect: =Navigate(scrIntro, ScreenTransition.Fade)
