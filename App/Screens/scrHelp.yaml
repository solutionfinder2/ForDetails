                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =10
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                      Children:
                        - conFAQ1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =If(varFAQ1, 150, 58)
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                              PaddingTop: =8
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
