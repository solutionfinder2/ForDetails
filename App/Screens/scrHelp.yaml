# =============================================================
# scrHelp - Help / FAQ screen (RESPONSIVE, MODERN CONTROLS)
# Expandable FAQ accordion (click a question to expand/collapse)
# plus a contact-support card.
# =============================================================
Screens:
  scrHelp:
    Properties:
      Fill: =RGBA(246, 247, 251, 1)
      LoadingSpinnerColor: =RGBA(55, 63, 75, 1)
    Children:
      - imgBackground_Help:
          Control: Image
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            ImagePosition: =ImagePosition.Fill
      - conRoot_Help:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
          Children:
            # ---------------- SIDEBAR ----------------
            - conSidebar_Help:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Width: =245
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =6
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =12
                  PaddingRight: =12
                  Fill: =RGBA(33, 37, 45, 1)
                  Visible: =varSidebarOpen
                  DropShadow: =DropShadow.None
