                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                              PaddingTop: =8
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - btnFAQ3:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: =If(varFAQ3, "▾   ", "▸   ") & "Can I cancel or change my registration?"
                                    Height: =42
                                    FillPortions: =0
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =RGBA(23, 32, 51, 1)
                                    OnSelect: =Set(varFAQ3, !varFAQ3)
                              - lblFAQ3Answer:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Yes. Open My Registrations and click Cancel Registration on the session you want to release. Your seat is then freed for another participant. To change your slot, cancel first and then register for the new time."
                                    Height: =88
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Color: =RGBA(104, 115, 138, 1)
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingLeft: =16
                                    PaddingRight: =10
                                    Visible: =varFAQ3
                        - conFAQ4:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =If(varFAQ4, 150, 58)
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                              PaddingTop: =8
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
