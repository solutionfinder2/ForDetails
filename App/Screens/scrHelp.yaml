                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
                              - btnFAQ1:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: =If(varFAQ1, "▾   ", "▸   ") & "How do I register for a session?"
                                    Height: =42
                                    FillPortions: =0
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =RGBA(23, 32, 51, 1)
                                    OnSelect: =Set(varFAQ1, !varFAQ1)
                              - lblFAQ1Answer:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Go to the Register page, pick a date, and choose any time slot that still has seats available (each slot holds a maximum of 20 participants). Click Next, review your details, and confirm. Your seat is reserved immediately."
                                    Height: =88
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Color: =RGBA(104, 115, 138, 1)
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingLeft: =16
                                    PaddingRight: =10
                                    Visible: =varFAQ1
                        - conFAQ2:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =If(varFAQ2, 150, 58)
                              FillPortions: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =0
                              PaddingTop: =8
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(228, 231, 239, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                            Children:
