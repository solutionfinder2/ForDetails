                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: =If(varFAQ2, "▾   ", "▸   ") & "Why is a time slot disabled or marked as Full?"
                                    Height: =42
                                    FillPortions: =0
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Transparent
                                    Color: =RGBA(23, 32, 51, 1)
                                    OnSelect: =Set(varFAQ2, !varFAQ2)
                              - lblFAQ2Answer:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Each time slot has a hard capacity of 20 participants. Once 20 people have registered, the slot shows as Full and can no longer be selected. If someone cancels, the seat becomes available again automatically."
                                    Height: =88
                                    AutoHeight: =true
                                    FillPortions: =0
                                    Size: =13
                                    Color: =RGBA(104, 115, 138, 1)
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingLeft: =16
                                    PaddingRight: =10
                                    Visible: =varFAQ2
